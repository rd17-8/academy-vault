<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GEMBALL · Where football's gems are found</title>
<meta name="description" content="GEMBALL: the private scouting platform for academy football. Squads, match video and highlight reels in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d10'/%3E%3Cpath d='M9.8 7.4H22.2L27 13.1 16 26.1 5 13.1Z' fill='%23c8f43c' fill-opacity='.25' stroke='%23c8f43c' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M5 13.1H27M12.6 13.1 16 7.4 19.4 13.1 16 26.1 12.6 13.1' fill='none' stroke='%23c8f43c' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* GEMBALL: sports-tech scouting desk. Ink-black chrome, clean white work surfaces, electric-lime signal colour */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --ink:#0b0d10; --muted:#5d636b; --line:#e1e4dc;
  --bar:#0b0d10; --bar-ink:#f4f5f1; --bar-muted:#8d949c;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#eef9cf; --ok:#2f7d1f; --danger:#c0362c; --link:#3b6f00;
  --gold:#c8f43c;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --shadow:0 1px 2px rgba(11,13,16,.04),0 10px 30px -18px rgba(11,13,16,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08090b; --surface:#111418; --sunk:#050607; --ink:#eef0ea; --muted:#8e959d; --line:#1f242a;
  --bar:#050607; --bar-ink:#eef0ea; --bar-muted:#7c838b;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#1f2810; --ok:#8fe06a; --danger:#ff8a80; --link:#c8f43c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090b; --surface:#111418; --sunk:#050607; --ink:#eef0ea; --muted:#8e959d; --line:#1f242a;
  --bar:#050607; --bar-ink:#eef0ea; --bar-muted:#7c838b;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#1f2810; --ok:#8fe06a; --danger:#ff8a80; --link:#c8f43c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7); color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.topbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.topbar .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.logo{color:var(--bar-ink);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.18em;line-height:1}
.logo small{display:block;font-size:.62rem;letter-spacing:.06em;color:var(--bar-muted);margin-top:4px}
.navlinks a[aria-current="page"]{color:var(--accent-ink)!important;background:var(--accent)!important}
.search{position:relative;flex:1;min-width:200px;max-width:440px}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--bar-ink);border-radius:8px;padding:8px 12px;font:inherit}
.search input::placeholder{color:var(--bar-muted)}
.results{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:inherit;text-decoration:none}
.results a:hover,.results a:focus{background:var(--sunk)}
.results .h{font-size:.75rem;color:var(--muted);padding:8px 12px 2px;letter-spacing:.04em}
.navlinks{display:flex;gap:4px;margin-inline-start:auto}
.navlinks a,.navlinks button{color:var(--bar-muted);text-decoration:none;font:inherit;font-weight:600;padding:6px 10px;border-radius:6px;background:none;border:0;cursor:pointer;white-space:nowrap}
.navlinks a[aria-current="page"],.navlinks a:hover,.navlinks button:hover{color:var(--bar-ink);background:rgba(255,255,255,.08)}
.crumbs{background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs .wrap{padding-block:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.crumbs a{color:var(--link);text-decoration:none}
.crumbs span.sep{color:var(--muted)}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
h1{font-size:2.4rem} h2{font-size:1.35rem}
h3{font-size:1rem;margin:0;font-weight:600}
.eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel.sub{background:var(--bg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=color]{padding:2px;height:40px;width:56px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:8px 16px;transition:border-color .15s,background .15s,transform .15s;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary .kbd{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger:hover,.btn.armed{color:var(--danger)}
.btn.big{font-size:1.05rem;padding:11px 18px}
.btn.sm{font-size:.85rem;padding:4px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.ex{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;white-space:nowrap}
.kbd{font-family:var(--f-num);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
/* flags, crests, kits */
.flag{width:48px;aspect-ratio:4/3;border-radius:5px;overflow:hidden;flex:none;display:inline-block;position:relative;box-shadow:0 1px 2px rgba(10,20,35,.18),0 0 0 1px rgba(10,20,35,.08);vertical-align:middle;background:var(--sunk)}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.08));pointer-events:none}
.flag.sm{width:22px;border-radius:3px}
.flag.lg{width:112px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.15)}
.crest{width:44px;height:44px;flex:none;display:inline-grid;place-items:center}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.sm{width:28px;height:28px}
.crest.lg{width:84px;height:84px}
.mf-hint{display:block}.mf-hint .tag{display:inline-block;max-width:100%;white-space:normal;position:static;margin-top:4px}
.kit{--k:#444;--kt:#fff;--ks:#999;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:7px 7px 12px 12px;background:var(--k);color:var(--kt);border:3px solid var(--ks);font-family:var(--f-num);font-weight:500;font-size:.95rem;flex:none}
/* country grid */
.countries{display:grid;gap:14px 10px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.country{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px 8px;border-radius:12px;text-decoration:none;color:var(--ink);text-align:center;font-size:.9rem;font-weight:600;line-height:1.25;position:relative;transition:background .15s}
.country .flag{width:84px;border-radius:8px;transition:transform .18s ease,box-shadow .18s ease}
.country:hover{background:var(--surface)}
.country:hover .flag{transform:translateY(-3px);box-shadow:0 10px 20px rgba(10,20,35,.22),0 0 0 1px rgba(10,20,35,.08)}
.country .badge{position:absolute;top:2px;inset-inline-end:8px;z-index:1;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:.72rem;border-radius:999px;min-width:22px;padding:1px 6px;box-shadow:0 0 0 2px var(--bg)}
.country small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.mycountries{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr))}
.mycountry{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.mycountry:hover{border-color:var(--accent);transform:translateY(-2px)}
.mycountry .flag{width:76px;border-radius:8px}
.mycountry b{font-size:1.08rem;display:block}
.mycountry .mini{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.82rem}
.mycountry .mini span b{display:inline;font-family:var(--f-num);font-size:.9rem;color:var(--ink);font-weight:500}
.mycountry .wash{position:absolute;inset:0 auto 0 0;width:45%;opacity:.13;background-size:cover;background-position:center;filter:blur(14px) saturate(1.3);pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent)}
.band{position:relative;overflow:hidden;border-radius:22px;background:var(--bar);color:var(--bar-ink);padding:34px 30px}
/* scouting-radar backdrop: a lime glow over a fine data grid */
.band::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 88% 10%,rgba(200,244,60,.28),transparent 60%),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px;pointer-events:none}
.band::after{content:"";position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;border-radius:50%;border:2px solid rgba(200,244,60,.25);box-shadow:0 0 0 40px rgba(200,244,60,.05),0 0 0 80px rgba(200,244,60,.03);pointer-events:none}
.band .eyebrow{color:var(--accent)!important}
.band h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.band h1 span{color:var(--accent)}
.band .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.2);opacity:.45;pointer-events:none}
.band .bg+.shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(6,12,10,.9),rgba(6,12,10,.35));pointer-events:none}
.band>.in{position:relative;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.band .eyebrow{color:var(--bar-muted)}
.band h1{color:#fff}
.band .stats .v{color:#fff}.band .stats .l{color:var(--bar-muted)}
.band .grow{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.band .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.band .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip .flag{width:30px;border-radius:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* cards & lists */
a.card{text-decoration:none;color:inherit}
a.card:hover,button.card:hover{border-color:var(--accent)}
button.card{font:inherit;color:inherit;text-align:inherit;cursor:pointer}
.card-acts{justify-content:flex-end;gap:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .grow b,.item .grow span{overflow-wrap:anywhere}
a.item{color:inherit;text-decoration:none}
a.item:hover b{color:var(--link)}
.chip{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{cursor:default}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side b{overflow-wrap:anywhere}
.score{font-family:var(--f-num);font-size:1.4rem}
.vsw{font-family:var(--f-display);font-size:1.1rem}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.video-box iframe,.video-box .ytslot{position:absolute;inset:0;width:100%;height:100%;border:0}
.srcswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srcswitch button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:5px 10px;cursor:pointer}
.srcswitch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .meta{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-num);font-size:1.5rem}
.stat .l{font-size:.8rem;color:var(--muted)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:start;padding:8px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;border-top:0}
td a{color:var(--link);text-decoration:none;font-weight:600}
/* match room */
.stage{display:grid;gap:16px;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
section.stack{gap:12px}
.video-box{background:#000;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.video-box video{width:100%;height:100%;display:block;background:#000}
.video-box .empty{color:#d4dbe4;text-align:center;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:460px}
.timeline{direction:ltr;position:relative;height:30px;background:var(--sunk);border-radius:6px;cursor:pointer;overflow:hidden}
.timeline .mk{position:absolute;top:5px;bottom:5px;min-width:4px;border-radius:3px;opacity:.9}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.timeline .sel{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.3}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--f-num);font-size:1.15rem;background:var(--sunk);padding:6px 12px;border-radius:8px}
.roster{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:440px){.roster{grid-template-columns:1fr}}
.roster .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.pbtn{font:inherit;display:flex;gap:8px;align-items:center;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:start;min-width:0}
.pbtn span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.io{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.io .t{font-family:var(--f-num);font-size:1.1rem}
.stars button{font:inherit;font-size:1.2rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--accent)}
.rating{color:var(--accent);letter-spacing:1px}
.toast .tbtn{pointer-events:auto;font:inherit;font-weight:700;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;margin-inline-start:12px;padding:0}
.rate{display:inline-flex;vertical-align:middle}
.rate button{background:none;border:0;padding:0 1px;cursor:pointer;font-size:1.05rem;line-height:1;color:var(--line)}
.rate button.on{color:var(--accent)}
.rate button:hover{transform:scale(1.15)}
.item select.act{font-size:.85rem;padding:3px 6px;max-width:190px}
.item.picked{background:var(--accent-soft);border-radius:8px}
.cliptools{position:sticky;top:0;z-index:2;background:var(--surface)}
.timeline .mk{cursor:pointer}
.timeline .mk:hover{opacity:1;transform:scaleY(1.25)}
/* player quick view: opens beside the match video, no backdrop, so the match keeps playing */
.qv{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(380px,100%);z-index:35;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.28);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:700px){.qv{top:auto;width:100%;max-height:60vh;border-inline-start:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}}
.qv .x{margin-inline-start:auto;flex:none}
.qv .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.qv .facts select,.qv .facts input{padding:5px 8px}
/* reel preview */
.overlay{position:absolute;inset:auto 0 0 0;padding:12px 14px;display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));color:#fff;pointer-events:none}
.overlay .who{display:flex;flex-direction:column;line-height:1.2}
.overlay .who b{font-size:1.2rem}
.overlay .count{margin-inline-start:auto;font-family:var(--f-num)}
.overlay .act{position:absolute;bottom:calc(100% - 4px);inset-inline-start:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,10,18,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal .panel{width:min(720px,100%);max-height:90vh;overflow:auto}
.modal .panel.wide{width:min(1060px,100%)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
textarea{font:inherit;width:100%;resize:vertical}
.review{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.thumbs{display:flex;flex-direction:column;gap:8px;width:220px;max-width:100%;position:sticky;top:0}
.thumbs img{border-radius:8px;border:1px solid var(--line);display:block}
table.imp{min-width:560px}
table.imp td{padding:4px 6px}
table.imp input,table.imp select{width:100%;padding:5px 8px}
table.imp input.n{width:64px}table.imp input.y{width:84px}
table.imp input.chk{outline:2px solid var(--danger);outline-offset:-1px}
table.imp img.numcut{height:30px;max-width:60px;background:#fff;border-radius:4px;border:1px solid var(--line,#ccc)}
table.imp tr.off td{opacity:.45}
.tag{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.new{color:var(--ok);border:1px solid var(--ok)}
.tag.upd{color:var(--accent);border:1px solid var(--accent)}
/* record-to-tag */
.btn.rec{background:#e5383b;border-color:#e5383b;color:#fff}
.btn.rec:hover{border-color:#b9262a;filter:brightness(1.05)}
.btn.rec.on{background:#111;border-color:#e5383b;color:#fff;box-shadow:0 0 0 3px rgba(229,56,59,.35)}
.btn.rec .kbd{background:transparent;color:inherit;border-color:currentColor}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.btn.rec.on .dot,.recbadge .dot,.recpanel .dot{background:#e5383b;animation:recblink 1s steps(2) infinite}
.recbadge{position:absolute;top:12px;left:12px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.72);color:#fff;font:700 .85rem var(--f-num);padding:5px 11px;border-radius:999px;pointer-events:none}
.recpanel{display:flex;flex-direction:column;gap:12px}
.recpanel .row b{font-size:1.1rem}.recpanel .rec-time{font-size:1.6rem;margin-inline-start:auto}
@keyframes recblink{50%{opacity:.25}}
.tag.wait{color:var(--muted);border:1px dashed var(--muted);display:inline-block;margin-top:4px}
.stat .l{text-transform:uppercase;letter-spacing:.12em;font-size:.68rem!important}
.tabs button{text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.modal canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* sign-in, device approval and the owner's accounts panel */
body.locked>*:not(#gate):not(#toast):not(#modal-root){display:none!important}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60vw 60vw at 85% -10%,rgba(200,244,60,.12),transparent 60%),var(--bg)}
.gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.gate-card h1{font-size:2rem}
.gate-card p{margin:0}
.gate-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gate-logo svg{width:34px;height:34px}
.gate-logo b{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:1.3rem}
.gate-form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.gate-form input{width:100%;font-size:1rem;padding:11px 12px}
.gate-form .btn{justify-content:center;padding:11px 16px}
.gate-dev{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gate-dev .num{font-size:1.1rem;color:var(--ink)}
.small{font-size:.85rem}
.wsbar{background:var(--accent);color:var(--accent-ink);font-weight:600}
.wsbar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.wsbar .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 .72rem var(--f-num);margin-inline-start:6px;vertical-align:middle}
.nbadge.warn{background:var(--danger);color:#fff}
.adm-sec .item.bad b+span{color:var(--danger);font-weight:600}
.chip-s{display:inline-block;font-size:.72rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-inline-start:4px}
.chip-s.ok{border-color:var(--accent);color:var(--link)}
.modal .panel.wide{width:min(900px,100%)}
.adm-sec{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.adm-sec:first-child{border-top:0;padding-top:0}
.adm-sec h3{margin:0}
.acct{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.acct.off{opacity:.6}
.acct .item:first-child{border-top:0}
.invite{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.invite pre{margin:0;white-space:pre-wrap;font:inherit;font-size:.9rem}
.sync{font-size:.78rem;color:var(--muted);align-self:center}
.sync[data-s="error"]{color:var(--danger)}
</style>
</head>

/* signing in is what connects the cloud: videos go to, and play from, the space that is open */
function cloudCfg(){return session?{url:API,key:session.token}:null}
function parseCloudCode(s){const m=String(s||"").trim().match(/^(https?:\/\/[^\s#]+?)\/?#([a-f0-9]{32,})$/i);return m?{url:m[1],key:m[2]}:null}
const cloudSrc=m=>session&&m?.cloud?.name?`${API}/v/${encodeURIComponent(m.cloud.name)}?k=${encodeURIComponent(session.token)}&ws=${encodeURIComponent(curWS())}`:null;
const isCloud=src=>/^https?:/.test(src||"");
/* matches with a cloud copy play from it unless a file from this computer is attached */
function linkCloud(){S.matches.forEach(m=>{const s=cloudSrc(m);if(s&&!(videoMap[m.id]&&!isCloud(videoMap[m.id])))videoMap[m.id]=s})}
/* every call carries the session and the open space; a session the server no longer accepts (device switched off,
   account switched off, expired) signs this device out */
async function api(path,{method="GET",body,ws}={}){
  if(!session)throw new Error("Please sign in");
  let r;
  try{r=await fetch(API+path,{method,headers:{...(body?{"content-type":"application/json"}:{}),"x-key":session.token,"x-ws":ws||curWS()},body:body?JSON.stringify(body):undefined})}
  catch(e){const x=new Error("No connection to the GEMBALL cloud");x.status=0;throw x}
  const j=await r.json().catch(()=>({}));
  if(r.status===401){signOut("expired");const x=new Error("Please sign in again");x.status=401;throw x}
  if(!r.ok){const x=new Error(j.error||"The GEMBALL cloud didn't answer");x.status=r.status;x.data=j;throw x}
  return j;
}
const cloudApi=(path,body)=>api(path,body?{method:"POST",body}:{});
const gb=n=>(n/2**30).toFixed(n<2**30?2:1)+" GB";
const loadJobs=()=>{try{return JSON.parse(localStorage.getItem(JOBS_KEY)||"{}")||{}}catch(e){return {}}};
const saveJobs=j=>{try{localStorage.setItem(JOBS_KEY,JSON.stringify(j))}catch(e){}};
const cloudRuns={};/* copies running in this page, by match id */
const cloudPct=st=>Math.round(Object.keys(st.done).length/st.parts*100);
function showCloudProgress(id){const st=cloudRuns[id];if(!st)return;const p=cloudPct(st);
  $$(`[data-cloudprog="${id}"]`).forEach(el=>{const b=el.querySelector("i");if(b)b.style.width=p+"%";const t=el.querySelector("span");if(t)t.textContent=`Copying to the cloud: ${p}% of ${gb(st.size)}`})}
/* the copy runs in 100 MB parts, three at a time; each finished part is remembered, so a closed page resumes where it stopped */
async function runCopy(m,link,resume){
  const st=resume||{...(await cloudApi("/start",{link,id:m.id})),link,done:{}};
  cloudRuns[m.id]=st;const jobs=loadJobs();jobs[m.id]=st;saveJobs(jobs);
  if(cloudModalOpen(m.id))askCloud(m);
  if(current===Match&&route.id===m.id)Match.update();
  showCloudProgress(m.id);
  let next=1,failed=null;
  const lane=async()=>{while(!failed){while(st.done[next])next++;const n=next++;if(n>st.parts)return;
    for(let t=0;;t++){try{const r=await cloudApi("/part",{name:st.name,uploadId:st.uploadId,n,size:st.size,direct:st.direct,link:st.link});
        if(r.direct)st.direct=r.direct;st.done[n]=r.part;const j=loadJobs();j[m.id]=st;saveJobs(j);showCloudProgress(m.id);break}
      catch(e){if(t>=3){failed=e;return}await new Promise(r=>setTimeout(r,3000*(t+1)))}}}};
  try{
    await Promise.all([lane(),lane(),lane()]);
    if(failed)throw failed;
    const parts=Object.keys(st.done).map(Number).sort((a,b)=>a-b).map(n=>st.done[n]);
    await cloudApi("/complete",{name:st.name,uploadId:st.uploadId,parts});
    const j=loadJobs();delete j[m.id];saveJobs(j);delete cloudRuns[m.id];
    const mm=byId("matches",m.id);if(!mm)return;
    if(videoMap[m.id]&&isCloud(videoMap[m.id]))delete videoMap[m.id];
    mm.cloud={name:st.name,size:st.size,service:st.service,file:st.file};if(!mm.fileName)mm.fileName=st.file;
    const got=fillFromTitle(mm,st.file);
    linkCloud();if(current===Match&&route.id===m.id)Match.src="file";save();refresh();closeCloudModal(m.id);
    toast(`The video of ${matchLabel(mm)} is in the cloud${got.length?". From the file name: "+got.join(", "):""}`);
  }catch(e){delete cloudRuns[m.id];toast("The copy stopped: "+e.message+". Open the match and press Resume");refresh();closeCloudModal(m.id)}
}
const cloudModalOpen=id=>$("#modal-root .modal")?.dataset.cloud===id;
const closeCloudModal=id=>{if(cloudModalOpen(id))closeModal()};

    <div class="row"><button class="btn primary" id="cl-set">Open Settings</button></div>`);$("#cl-set").onclick=()=>{closeModal();$("#nav-settings").click()};return}

      <label class="f">Download link<input id="cl-link" type="url" dir="ltr" placeholder="https://we.tl/…  or  https://www.swisstransfer.com/d/…" value="${esc(job?.link||"")}"></label>
      <div class="row"><button class="btn" id="cl-check">Check link</button></div><div id="cl-out"></div>`}`);
  $("#modal-root .modal").dataset.cloud=m.id;
  if(run){showCloudProgress(m.id);return}
  const out=$("#cl-out");
  if(job){$("#cl-resume").onclick=()=>runCopy(m,job.link,job);
    $("#cl-drop").onclick=async()=>{try{await cloudApi("/abort",{name:job.name,uploadId:job.uploadId})}catch(e){}const j=loadJobs();delete j[m.id];saveJobs(j);askCloud(m)}}
  $("#cl-check").onclick=async()=>{const link=$("#cl-link").value.trim();if(!link){toast("Paste the link first");return}
    out.innerHTML=`<p class="muted">Reading the link…</p>`;
    try{const r=await cloudApi("/resolve",{link});
      out.innerHTML=`<div class="item"><div class="grow"><b>${esc(r.name)}</b><div class="muted">${gb(r.size)} · from ${esc(r.service)}${r.files>1?` · the largest video of ${r.files} files`:""}</div></div></div>
        ${m.cloud?`<p class="muted">This replaces the video already in the cloud for this match.</p>`:""}
        <div class="row" style="margin-top:8px"><button class="btn primary" id="cl-go">Copy to the cloud</button></div>`;
      $("#cl-go").onclick=()=>{out.innerHTML=`<p class="muted">Starting…</p>`;
        runCopy(m,link).catch(e=>{if(cloudModalOpen(m.id)&&$("#cl-out"))$("#cl-out").innerHTML=`<div class="notice">${esc(e.message)}</div>`})}}
    catch(e){out.innerHTML=`<div class="notice">${esc(e.message)}</div>`}};
}

/* ---------- YouTube ---------- */
function ytId(url){
  try{const u=new URL(String(url).trim());const h=u.hostname.replace(/^(www|m|music)\./,"");
    if(h==="youtu.be")return u.pathname.slice(1).split("/")[0]||null;
    if(h.endsWith("youtube.com")||h.endsWith("youtube-nocookie.com")){
      if(u.searchParams.get("v"))return u.searchParams.get("v");
      const m=u.pathname.match(/\/(embed|live|shorts|v)\/([\w-]{6,})/);if(m)return m[2];}
  }catch(e){}
  const m=String(url||"").trim().match(/^[\w-]{11}$/);return m?m[0]:null;
}
const ytLink=(id,t)=>`https://youtu.be/${id}${t?"?t="+Math.floor(t):""}`;
let ytPromise=null;
function loadYT(){
  if(ytPromise)return ytPromise;
  ytPromise=new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player)return res(window.YT);
    const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();res(window.YT)};
    const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.referrerPolicy="strict-origin-when-cross-origin";s.onerror=()=>{ytPromise=null;rej()};document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),20000);
  });
  return ytPromise;
}
const YT_ERR={2:"Invalid video ID",5:"The video isn't supported by the player",100:"The video doesn't exist, was deleted or is private",101:"The owner has blocked embedding on other sites",150:"The owner has blocked embedding on other sites",152:"The owner has blocked embedding on other sites",153:"YouTube rejected this site's address (error 153)"};
/* wraps a YouTube player so it behaves like a <video> element */
const webOrigin=()=>/^https?:$/.test(location.protocol)&&location.origin&&location.origin!=="null";
function whereNow(){return location.protocol==="file:"?"a local file (file://)":webOrigin()?location.host:"a preview window ("+(location.protocol||"no address")+")"}
/* builds the embed iframe ourselves so the referrer policy is set before it loads, then wraps it like a <video> */
function makeYT(el,videoId,onErr){
  if(!webOrigin())return Promise.reject(new Error("env"));
  return loadYT().then(YT=>new Promise((res,rej)=>{
    let ready=false;
    const f=document.createElement("iframe");
    f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title="YouTube player";
    f.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0";
    f.src=`https://www.youtube.com/embed/${encodeURIComponent(videoId)}?enablejsapi=1&rel=0&playsinline=1&modestbranding=1&origin=${encodeURIComponent(location.origin)}&widget_referrer=${encodeURIComponent(location.href.split("#")[0])}`;
    el.replaceWith(f);
    const p=new YT.Player(f,{events:{onReady:()=>{ready=true;res(wrap)},
      onError:e=>{const msg=YT_ERR[e.data]||("YouTube player error ("+e.data+")");onErr&&onErr(msg,e.data);if(!ready)rej(new Error(msg))}}});
    const wrap={isYT:true,yt:p,
      get currentTime(){try{return p.getCurrentTime()||0}catch(e){return 0}},
      set currentTime(t){try{p.seekTo(t,true)}catch(e){}},
      get duration(){try{return p.getDuration()||0}catch(e){return 0}},
      get paused(){try{const st=p.getPlayerState();return st!==1&&st!==3}catch(e){return true}},
      get ended(){try{return p.getPlayerState()===0}catch(e){return false}},
      play(){try{p.playVideo()}catch(e){}return Promise.resolve()},
      pause(){try{p.pauseVideo()}catch(e){}},
      load(id,start){p.loadVideoById({videoId:id,startSeconds:start||0})},
      videoId(){try{return p.getVideoData().video_id}catch(e){return null}},
      addEventListener(){},
      destroy(){try{p.destroy()}catch(e){}try{f.remove()}catch(e){}}};
  }));
}

let route={};
function parse(){const p=(location.hash.replace(/^#\/?/,"")||"").split("/").map(decodeURIComponent);return{view:p[0]||"home",id:p[1]||null}}
const nav=(view,id)=>{location.hash="#/"+view+(id?"/"+encodeURIComponent(id):"")};

let current=null;
function refresh(full){
  const r=parse();
  const changed=full||r.view!==route.view||r.id!==route.id;
  route=r;
  if(changed){
    if(current&&current.unmount)current.unmount();
    current=VIEWS[route.view]||VIEWS.home;
    $("#root").innerHTML="";
    current.mount($("#root"));
    window.scrollTo(0,0);
  }
  current.update();
  $("#nav-home").toggleAttribute("aria-current",route.view==="home"||route.view==="country");
  if(route.view==="home"||route.view==="country")$("#nav-home").setAttribute("aria-current","page");
  $("#nav-hl").toggleAttribute("aria-current",route.view==="highlights");
  if(route.view==="highlights")$("#nav-hl").setAttribute("aria-current","page");
}

async function ytMeta(id){

  for(const api of[`https://www.youtube.com/oembed?format=json&url=${url}`,`https://noembed.com/embed?url=${url}`]){
    try{const r=await fetch(api);if(r.ok){const j=await r.json();if(j.title)return j}}catch(e){}
  }

}

const TITLE_NOISE=/(?<![\p{L}\d])(highlights?|תקציר|משחק מלא|full ?match|full ?game|extended|r[eé]sum[eé]|buts|goals?|gols|melhores momentos|live|en direct|direct|replay|hd|4k|match complet|partido completo|official|video|vid[eé]o|amical|friendly|amistoso|game|match|partido|jogo|n[°o]? ?\d+)(?![\p{L}\d])/giu;
const pad2=n=>String(n).padStart(2,"0");
function cleanTeam(s){
  return String(s||"").replace(TITLE_NOISE," ").replace(/\b(U|SUB|U-)\s?\d{1,2}\b/gi," ").replace(/\b(19|20)\d\d\b/g," ")
    .replace(/^[\s\-–—:,.!?'"«»]+|[\s\-–—:,.!?"«»]+$/g,"").replace(/\s+/g," ").trim().split(" ").map(teamCase).join(" ");
}
/* "DREAM TEAM FC" → "Dream Team FC": shouting titles become names, short club initials stay capitals */
function teamCase(w){
  if(w!==w.toUpperCase()||!/\p{Lu}/u.test(w))return w;
  return w.replace(/[.\-]/g,"").length<=3?w:w.charAt(0)+w.slice(1).toLowerCase().replace(/([\-'’])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
}
function parseMatchTitle(title){
  const r={home:"",away:"",homeScore:null,awayScore:null,date:"",competition:""};
  let s=String(title||"").replace(/[\u{1F000}-\u{1FAFF}☀-➿️]/gu," ").replace(/\((\d{1,2})\)/g," $1 ").replace(/\s+/g," ").trim();
  let m=s.match(/\b(20\d\d)[-./](\d{1,2})[-./](\d{1,2})\b/);
  if(m){r.date=`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;s=s.replace(m[0]," ")}
  else if((m=s.match(/\b(\d{1,2})[-./](\d{1,2})[-./](20\d\d|\d\d)\b/))){r.date=`${m[3].length===2?"20"+m[3]:m[3]}-${pad2(m[2])}-${pad2(m[1])}`;s=s.replace(m[0]," ")}
  const segs=s.split(/\s*[|•·｜#\[\]]\s*|\s+\/\s+|:\s+|\s*[()]\s*/).map(x=>x.trim()).filter(Boolean);
  const SCORE=/^(.*?\D)\s*\b(\d{1,2})\s*[-–:]\s*(\d{1,2})\b\s*(\D.*)$/,VS=/^(.+?)\s+(?:vs\.?|v\.?|versus|x|contre|נגד|gegen|contra)\s+(.+)$/i,DASH=/^(.+?)\s+[-–—]\s+(.+)$/;
  let hit=-1;
  for(const re of[SCORE,VS,DASH]){hit=segs.findIndex(x=>re.test(x));if(hit<0)continue;
    const g=segs[hit].match(re);
    if(re===SCORE){r.home=g[1];r.homeScore=+g[2];r.awayScore=+g[3];r.away=g[4]}else{r.home=g[1];r.away=g[2];
      /* "A vs B 2-2" or "A 2 vs 1 B" */
      let sm=r.away.match(/\s(\d{1,2})\s*[-–:]\s*(\d{1,2})\s*$/);
      if(sm){r.homeScore=+sm[1];r.awayScore=+sm[2];r.away=r.away.slice(0,sm.index)}
      else if((sm=r.home.match(/\s(\d{1,2})$/))&&/^\d{1,2}\s/.test(r.away)){r.homeScore=+sm[1];r.home=r.home.slice(0,sm.index);r.awayScore=parseInt(r.away);r.away=r.away.replace(/^\d{1,2}\s+/,"")}}
    break}
  if(hit<0)return r;
  r.away=r.away.split(/\s+[-–—]\s+/)[0];r.home=r.home.split(/\s+[-–—]\s+/).pop();
  r.home=cleanTeam(r.home);r.away=cleanTeam(r.away);
  r.competition=segs.filter((x,i)=>i!==hit).map(x=>x.replace(TITLE_NOISE," ").replace(/\b(du|de|del|do|da|the|of|en)\s*$/i,"").replace(/\s+/g," ").replace(/^[\s\-–—,.]+|[\s\-–—,.]+$/g,"")).find(x=>x.replace(/[^\p{L}]/gu,"").length>=3)||"";
  if(!r.competition&&/(?<![\p{L}])(amical|friendly|amistoso|amig[aá]vel|test ?match|ידידות)(?![\p{L}])/iu.test(String(title)))r.competition="Friendly";
  return r;
}
/* a video's file name or title ("FC OSA 2-1 Leader SC 31.10.2026.mp4") fills the score and date a match doesn't have yet.
   The goals go to the right club even when the title names them the other way round; a typed-in score is never replaced */
function fillFromTitle(m,title){
  const r=parseMatchTitle(String(title||"").replace(/\.[a-z0-9]{2,5}$/i,"").replace(/_+/g," "));
  const h=byId("teams",m.homeId),a=byId("teams",m.awayId),got=[];
  if(r.homeScore!=null&&r.awayScore!=null&&(m.homeScore==null||m.awayScore==null)&&h&&a){
    const same=Math.max(teamScore(r.home,h.name),teamScore(r.away,a.name)),flip=Math.max(teamScore(r.home,a.name),teamScore(r.away,h.name));
    if(Math.max(same,flip)>=.6){[m.homeScore,m.awayScore]=same>=flip?[r.homeScore,r.awayScore]:[r.awayScore,r.homeScore];got.push(`score ${m.homeScore}–${m.awayScore}`)}}
  if(r.date&&!m.date){m.date=r.date;got.push("date "+r.date)}
  return got;
}
/* "ASEC Mimosas U17" and "Asec Mimosas" are the same club; "FC", "Academy" and age groups don't tell clubs apart */
const TEAM_STOP=/^(fc|cf|sc|ac|afc|club|football|futbol|futebol|academy|academie|academia|akademie|the|de|du|des|la|le|el|fa|u\d{1,2}|sub\d{1,2})$/;
const teamTokens=n=>deacc(n).replace(/\bu[\s-]+(\d)/g,"u$1").split(/[^a-z0-9֐-׿]+/).filter(w=>w&&!TEAM_STOP.test(w));
function teamScore(a,b){
  const A=teamTokens(a),B=teamTokens(b);if(!A.length||!B.length)return 0;
  const ka=A.join(""),kb=B.join("");if(ka===kb)return 1;
  if(Math.min(ka.length,kb.length)>=4&&(ka.includes(kb)||kb.includes(ka)))return .9;
  return A.filter(w=>B.some(v=>w===v||(w.length>4&&lev(w,v)<=1))).length/Math.max(A.length,B.length);
}
function findTeam(name){
  let best=null,bs=0;S.teams.forEach(t=>{const sc=teamScore(name,t.name);if(sc>bs){bs=sc;best=t}});
  return bs>=.6?best:null;
}
/* drag a box (or just click) on the video thumbnail around a team's crest */
function openCrestCrop(img,onPick,box=$("#mf-crop")){
  box.hidden=false;
  box.innerHTML=`<div class="panel sub"><div class="spread"><b>Drag a square around the crest (or just click it)</b><button class="btn sm ghost" type="button" id="cr-close">Close</button></div>
    <canvas id="cr-cv" style="width:100%;max-width:640px;touch-action:none;cursor:crosshair;border-radius:8px"></canvas></div>`;
  const cv=$("#cr-cv"),ctx=cv.getContext("2d");cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  let a=null,sel=null;
  const draw=()=>{ctx.drawImage(img,0,0);if(sel){ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,sel.x,sel.y,sel.s,sel.s,sel.x,sel.y,sel.s,sel.s);ctx.strokeStyle="#c8f43c";ctx.lineWidth=Math.max(2,cv.width/300);ctx.strokeRect(sel.x,sel.y,sel.s,sel.s)}};
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  const square=(p,q)=>{let s=Math.max(Math.abs(q.x-p.x),Math.abs(q.y-p.y));
    if(s<cv.height*.03){s=cv.height*.22;return clampSq(p.x-s/2,p.y-s/2,s)}
    return clampSq(q.x<p.x?p.x-s:p.x,q.y<p.y?p.y-s:p.y,s)};
  const clampSq=(x,y,s)=>{s=Math.min(s,cv.width,cv.height);return {x:Math.max(0,Math.min(cv.width-s,x)),y:Math.max(0,Math.min(cv.height-s,y)),s}};
  cv.onpointerdown=e=>{a=pt(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!a)return;sel=square(a,pt(e));draw()};
  cv.onpointerup=e=>{if(!a)return;sel=square(a,pt(e));a=null;draw();
    const out=document.createElement("canvas");out.width=out.height=Math.min(200,Math.round(sel.s));
    out.getContext("2d").drawImage(img,sel.x,sel.y,sel.s,sel.s,0,0,out.width,out.height);
    onPick(out.toDataURL("image/png"));box.hidden=true;box.innerHTML=""};
  $("#cr-close").onclick=()=>{box.hidden=true;box.innerHTML=""};
  draw();box.scrollIntoView({block:"nearest"});
}
/* crests on Wikipedia: the club's article (and near matches) carry the logo file; flags, kit parts and wiki icons are skipped,
   and a file must share a word with the club's name or be called a logo/crest */
async function wikiCrests(name){
  const W="https://en.wikipedia.org/w/api.php?format=json&origin=*&",get=async q=>(await fetch(W+q)).json();
  const s=await get("action=query&list=search&srlimit=4&srsearch="+encodeURIComponent(name+" football"));
  const titles=s.query.search.map(r=>r.title);if(!titles.length)return [];
  const im=await get("action=query&prop=images&imlimit=60&redirects=1&titles="+encodeURIComponent(titles.join("|")));
  const toks=teamTokens(name).filter(w=>w.length>2),files=new Map();
  Object.values(im.query.pages).forEach(p=>(p.images||[]).forEach(i=>{
    const f=deacc(i.title.replace(/^File:/,"").replace(/\.\w+$/,""));
    if(/flag of|^kit |pictogram|icon|soccerball|wiki|commons|wiktionary|pencil|arrow|clef|gnome|robot|ambox|question book|portal|stadium|map|location/.test(f))return;
    const logo=/logo|crest|badge|emblem|ecusson|blason/.test(f);
    if(!/\.(png|svg|gif|webp|jpe?g)$/i.test(i.title)||/\.jpe?g$/i.test(i.title)&&!logo)return;/* sound files; photos of players and grounds */
    const sc=toks.filter(w=>f.includes(w)).length*2+(logo?1:0);
    if(sc>0&&!files.has(i.title))files.set(i.title,sc)}));
  if(!files.size)return [];
  const best=[...files].sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  const ii=await get("action=query&prop=imageinfo&iiprop=url&iiurlwidth=240&titles="+encodeURIComponent(best.join("|")));
  return Object.values(ii.query.pages).filter(p=>p.imageinfo?.[0]?.thumburl).sort((a,b)=>files.get(b.title)-files.get(a.title)).map(p=>({title:p.title.replace(/^File:/,""),src:p.imageinfo[0].thumburl}));
}

/* edit / delete straight from a match card, without opening the match; a deleted match (and its clips) can be undone */
function deleteMatchUndo(id){
  const m=byId("matches",id);if(!m)return;
  const clips=S.clips.filter(c=>c.matchId===id);
  del("matches",id);
  toast("Match deleted",{label:"Undo",fn:()=>{
    if(!byId("matches",m.id))S.matches.push(m);
    const have=new Set(S.clips.map(c=>c.id));S.clips.push(...clips.filter(c=>!have.has(c.id)));
    save();refresh();toast("Match is back")}});
}

let tagState=null;

const Match={
  v:null,_key:null,_clock:null,_prev:null,
  mount(root){

document.addEventListener("keydown",e=>{

/* ---------- accounts & devices ----------
   Nothing opens without signing in. Each browser makes its own device key and keeps it in IndexedDB; the private half
   can't be read out, so a password used on another computer only creates a new device that waits for the owner's approval */
const GEM=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8.2 5.2H23.8L29.8 12.4 16 28.6 2.2 12.4Z" fill="#c8f43c" fill-opacity=".22" stroke="#c8f43c" stroke-width="2.6" stroke-linejoin="round"/><path d="M2.2 12.4H29.8M11.8 12.4 16 5.2 20.2 12.4 16 28.6 11.8 12.4" fill="none" stroke="#c8f43c" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const APP_URL="https://rd17-8.github.io/academy-vault/";
let idbOpen=null;
function idb(){return idbOpen||(idbOpen=new Promise((ok,no)=>{const r=indexedDB.open("gemball-device",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=()=>{idbOpen=null;no(r.error)}}))}
async function idbGet(k){const db=await idb();return new Promise((ok,no)=>{const q=db.transaction("k").objectStore("k").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
function deviceLabel(){
  const u=navigator.userAgent;
  const b=/Edg\//.test(u)?"Edge":/SamsungBrowser/.test(u)?"Samsung Internet":/OPR\//.test(u)?"Opera":/Firefox\//.test(u)?"Firefox":/Chrome\//.test(u)?"Chrome":/Safari\//.test(u)?"Safari":"Browser";
  const o=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac OS X/.test(u)?"Mac":/Linux/.test(u)?"Linux":"";
  return o?`${b} on ${o}`:b;
}
async function myDevice(){
  let d=null;try{d=await idbGet("device")}catch(e){}
  if(d)return d;
  const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},false,["sign","verify"]);
  const j=await crypto.subtle.exportKey("jwk",kp.publicKey);
  d={id:crypto.randomUUID(),priv:kp.privateKey,pub:{x:j.x,y:j.y},label:deviceLabel()};
  await idbPut("device",d);
  return d;
}
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const shortId=id=>String(id||"").replace(/-/g,"").slice(0,8).toUpperCase().replace(/^(.{4})/,"$1·");
async function signIn(path,f){
  const d=await myDevice(),u=String(f.username||"").trim().toLowerCase(),ts=Date.now();
  const sig=b64u(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},d.priv,new TextEncoder().encode(`gemball-login|${u}|${d.id}|${ts}`)));
  let r;
  try{r=await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...f,username:u,device:{id:d.id,pub:d.pub,label:d.label},ts,sig})})}
  catch(e){throw new Error("No connection to the GEMBALL cloud")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"The GEMBALL cloud didn't answer");
  return j;
}

  pend=null;session={token:j.token,user:j.user};
  try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch(e){}
  try{localStorage.removeItem(CLOUD_KEY)}catch(e){} /* the old connection code held the owner's secret key; the session replaces it */
  await enter();
}
async function enter(){
  gateMsg(`<p class="muted">Opening your space…</p>`);
  const me=await api("/auth/me");
  session.user={...session.user,...me};
  try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch(e){}
  WS=null;wsName="";
  await loadData();englishize();moveLocalData();linkCloud();
  unlock();refresh(true);wsBar();adminNav();syncState("saved");
}
function signOut(reason){
  clearTimeout(saveTimer);
  session=null;WS=null;wsName="";dataVer=null;dirty=false;
  try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(UNDO_KEY)}catch(e){}
  S.teams=[];S.players=[];S.matches=[];S.clips=[];S.settings={brand:"",contact:""};
  Object.keys(videoMap).forEach(k=>delete videoMap[k]);
  exporting=false;closeModal();$("#root").innerHTML="";$("#ws-bar").hidden=true;$("#nav-admin").hidden=true;
  gate("login",reason==="expired"?"You were signed out. Sign in again.":"");
}
async function start(){
  if(!session){gate("login");return}
  try{await enter()}
  catch(e){if(!session)return; /* signOut already showed the sign-in */
    gateMsg(`<h1>Can't open GEMBALL</h1><div class="notice">${esc(e.message)}</div><div class="row"><button class="btn primary" id="g-retry">Try again</button></div>`);
    $("#g-retry").onclick=start}
}

/* ---------- the owner: clients' spaces, accounts, devices, requests from the website ---------- */
function wsBar(){
  const b=$("#ws-bar");
  if(!WS){b.hidden=true;b.innerHTML="";return}
  b.hidden=false;
  b.innerHTML=`<div class="wrap"><span>You're in <b>${esc(wsName||WS)}</b>'s space</span><button class="btn sm" id="ws-back">Back to my space</button></div>`;
  $("#ws-back").onclick=()=>openSpace(null);
}
async function openSpace(u,name){
  if(exporting)return;
  await settled();
  if(dirty){toast("Your changes aren't saved yet. Try again in a moment");return}
  const prev=[WS,wsName];
  WS=u;wsName=u?name||u:"";
  try{
    Object.keys(videoMap).forEach(k=>{if(isCloud(videoMap[k]))delete videoMap[k]});
    await loadData();linkCloud();closeModal();
    if(location.hash&&location.hash!=="#/")location.hash="#/";
    refresh(true);wsBar();toast(u?`Opened ${wsName}'s space`:"Back in your space");
  }catch(e){[WS,wsName]=prev;linkCloud();toast(e.message)}
}
let adminPoll=null;
async function adminNav(){
  const b=$("#nav-admin");b.hidden=!isAdmin();
  clearInterval(adminPoll);
  if(!isAdmin())return;
  const count=async()=>{if(!isAdmin())return;try{const [u,r]=await Promise.all([api("/admin/users"),api("/requests")]);
    const n=u.users.reduce((a,x)=>a+x.devices.filter(d=>d.status==="pending").length,0)+r.requests.length,el=$("#nav-admin-n");
    el.hidden=!n;el.textContent=n}catch(e){}};
  count();adminPoll=setInterval(count,60000);
}
$("#nav-admin").onclick=()=>openAdmin();
function genPass(){const c="abcdefghjkmnpqrstuvwxyz23456789",v=crypto.getRandomValues(new Uint8Array(12));return [...v].map(x=>c[x%c.length]).join("").replace(/^(.{4})(.{4})/,"$1-$2-")}
const slugUser=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,24);
function inviteBox(u,name,pw){
  const txt=`GEMBALL access for ${name}\n\nOpen: ${APP_URL}\nUsername: ${u}\nPassword: ${pw}\n\nThe first time you sign in on a phone or computer, it waits until GEMBALL approves that device.`;
  return `<div class="invite" data-text="${esc(txt)}"><b>Send this to ${esc(name)}</b><pre>${esc(txt)}</pre>
    <div class="row"><button class="btn sm primary" data-inv="copy">Copy</button>${navigator.share?`<button class="btn sm" data-inv="share">Share…</button>`:""}</div>
    <p class="muted small" style="margin:0">The password isn't shown again. You can always set a new one.</p></div>`;
}
function wireInvites(box){$$("[data-inv]",box).forEach(b=>b.onclick=async()=>{const txt=b.closest(".invite").dataset.text;
  try{if(b.dataset.inv==="share")await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);toast("Copied")}}catch(e){}})}
async function openAdmin(){
  openModal(`<div class="spread"><h2>Accounts & devices</h2><button class="btn ghost" data-close>Close</button></div><div id="adm" style="display:flex;flex-direction:column;gap:14px"><p class="muted">Loading…</p></div>`);
  $("#modal-root .panel").classList.add("wide");
  await drawAdmin();
}
/* the activity log: who signed in or opened GEMBALL, when, on which device and from where; refused attempts stand out */
const EVT={login:"Signed in",open:"Opened GEMBALL","new-device":"New device asked for approval","wrong-password":"Wrong password","unknown-user":"Tried an unknown username",
  locked:"Locked out after too many wrong passwords","disabled-try":"Tried a switched-off account","revoked-try":"Tried a switched-off device",setup:"Created the owner account",
  "create-user":"Account created","reset-password":"New password set",disable:"Account switched off",enable:"Account switched on",approve:"Device approved",revoke:"Device switched off",remove:"Device removed"};
const EVT_BAD=new Set(["wrong-password","unknown-user","locked","disabled-try","revoked-try"]);
let regionNames=null;try{regionNames=new Intl.DisplayNames(["en"],{type:"region"})}catch(e){}
const countryName=c=>{try{return c&&regionNames?regionNames.of(c):c||""}catch(e){return c||""}};
const placeTxt=p=>p?[[p.city,countryName(p.country)].filter(Boolean).join(", "),p.ip?"IP "+p.ip:""].filter(Boolean).join(" · "):"";
let logFilter="",logShown=40;
function drawLog(log,U){
  const box=$("#adm-log");if(!box)return;
  const names=Object.fromEntries(U.map(u=>[u.username,u.name]));
  const rows=log.filter(e=>!logFilter||(logFilter==="!bad"?EVT_BAD.has(e.event):e.user===logFilter||e.by===logFilter));
  const when=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  box.innerHTML=rows.length?`<div class="list">${rows.slice(0,logShown).map(e=>`<div class="item${EVT_BAD.has(e.event)?" bad":""}"><span class="num muted small" style="width:96px;flex:none">${when(e.at)}</span>
      <div class="grow"><b>${esc(names[e.user]||e.user||"?")}</b> <span>${esc(EVT[e.event]||e.event)}</span>${e.by&&e.by!==e.user?` <span class="muted">by ${esc(names[e.by]||e.by)}</span>`:""}
      <div class="muted small">${[e.label?esc(e.label)+(e.device?` <span class="num">${shortId(e.device)}</span>`:""):"",esc(placeTxt(e))].filter(Boolean).join(" · ")}</div></div></div>`).join("")}</div>
    ${rows.length>logShown?`<div class="row"><button class="btn sm ghost" id="log-more">Show more</button></div>`:""}`:`<p class="muted small" style="margin:0">Nothing here yet.</p>`;
  const more=$("#log-more");if(more)more.onclick=()=>{logShown+=60;drawLog(log,U)};
}
async function drawAdmin(note,fromReq){
  const box=$("#adm");if(!box)return;
  let users,reqs,log;
  try{[users,reqs,log]=await Promise.all([api("/admin/users"),api("/requests"),api("/admin/log").then(r=>r.log).catch(()=>[])])}catch(e){box.innerHTML=`<div class="notice">${esc(e.message)}</div>`;return}
  if(!$("#adm"))return;
  const myDev=users.device,me=users.me;
  const U=users.users.sort((a,b)=>(b.role==="admin")-(a.role==="admin")||a.name.localeCompare(b.name));
  const pending=U.flatMap(u=>u.devices.filter(d=>d.status==="pending").map(d=>({u,d})));
  const when=t=>t?new Date(t).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"never";
  const btn=(action,u,d,label,cls)=>`<button class="btn sm ${cls}" data-dev="${action}" data-u="${esc(u.username)}" data-id="${esc(d.id)}">${label}</button>`;
  const devRow=(u,d)=>`<div class="item"><div class="grow"><b>${esc(d.label||"Device")}</b> <span class="num muted">${shortId(d.id)}</span>${d.id===myDev?`<span class="chip-s ok">this device</span>`:""}
      <div class="muted small">${d.status==="approved"?"Approved":d.status==="pending"?"Waiting for approval since "+when(d.created):"Switched off"} · last used ${when(d.lastSeen)}${d.lastPlace||d.firstPlace?` · ${esc(placeTxt(d.lastPlace||d.firstPlace))}`:""}</div></div>
      ${d.status!=="approved"?btn("approve",u,d,"Approve","primary"):""}${d.status==="approved"&&d.id!==myDev?btn("revoke",u,d,"Switch off","ghost"):""}${d.id!==myDev?btn("remove",u,d,"Remove","ghost danger"):""}</div>`;
  box.innerHTML=`${note||""}
    ${pending.length?`<section class="adm-sec"><h3>Waiting for your approval<span class="nbadge">${pending.length}</span></h3>
      <div class="list">${pending.map(({u,d})=>`<div class="item"><div class="grow"><b>${esc(u.name)}</b> <span class="muted">${esc(u.username)}</span>
        <div class="muted small">${esc(d.label)} · ID <span class="num">${shortId(d.id)}</span> · asked ${when(d.created)}${d.firstPlace?` from ${esc(placeTxt(d.firstPlace))}`:""}</div></div>${btn("approve",u,d,"Approve","primary")}${btn("remove",u,d,"Reject","ghost danger")}</div>`).join("")}</div>
      <p class="muted small" style="margin:0">Before approving, check with the person that the ID matches the one on their screen.</p></section>`:""}
    <section class="adm-sec"><div class="spread" style="flex-wrap:wrap;gap:8px"><h3>Activity${log.filter(e=>EVT_BAD.has(e.event)&&Date.now()-Date.parse(e.at)<7*864e5).length?`<span class="nbadge warn" title="Refused attempts in the last 7 days">${log.filter(e=>EVT_BAD.has(e.event)&&Date.now()-Date.parse(e.at)<7*864e5).length}</span>`:""}</h3>
      <select id="log-filter" style="max-width:260px"><option value="">Everyone</option><option value="!bad">Only refused attempts</option>${U.map(u=>`<option value="${esc(u.username)}">${esc(u.name)}</option>`).join("")}</select></div>
      <div id="adm-log"></div></section>
    <section class="adm-sec"><h3>Add a client</h3>
      <div class="formgrid"><label class="f">Name<input id="a-name" placeholder="e.g. Sporting Lagos Academy"></label>
        <label class="f">Username<input id="a-user" autocapitalize="none" spellcheck="false" dir="ltr" placeholder="e.g. sportinglagos"></label>
        <label class="f">Password<span class="row" style="gap:6px;flex-wrap:nowrap"><input id="a-pass" dir="ltr" autocomplete="off" style="flex:1;min-width:0"><button class="btn sm" type="button" id="a-gen">Generate</button></span></label></div>
      <div class="row"><button class="btn primary" id="a-create">Create account</button></div><div id="a-out"></div></section>
    <section class="adm-sec"><h3>Accounts</h3>
      ${U.map(u=>`<div class="acct${u.disabled?" off":""}"><div class="spread" style="flex-wrap:wrap;gap:8px"><div><b>${esc(u.name)}</b> <span class="muted">${esc(u.username)}</span>${u.role==="admin"?`<span class="chip-s ok">owner</span>`:""}${u.disabled?`<span class="chip-s">switched off</span>`:""}</div>
        <div class="row" style="gap:6px">${u.role!=="admin"?`<button class="btn sm" data-open="${esc(u.username)}" data-name="${esc(u.name)}">Open their space</button>`:""}<button class="btn sm ghost" data-pw="${esc(u.username)}" data-name="${esc(u.name)}">New password</button>${u.username!==me&&u.role!=="admin"?`<button class="btn sm ghost${u.disabled?"":" danger"}" data-off="${esc(u.username)}" data-v="${u.disabled?0:1}">${u.disabled?"Switch on":"Switch off account"}</button>`:""}</div></div>
        <div class="list">${u.devices.length?u.devices.map(d=>devRow(u,d)).join(""):`<p class="muted small" style="margin:6px 0 0">No device yet. Their first sign-in will wait here for your approval.</p>`}</div></div>`).join("")}</section>
    <section class="adm-sec"><h3>Requests from the website${reqs.requests.length?`<span class="nbadge">${reqs.requests.length}</span>`:""}</h3>
      ${reqs.requests.length?`<div class="list">${reqs.requests.map(r=>`<div class="item"><div class="grow"><b>${esc(r.name)}</b> · ${esc(r.org)} <span class="muted">(${esc(r.country)}${r.role?", "+esc(r.role):""})</span>
        <div class="muted small">${esc(r.contact)} · ${when(Date.parse(r.at))}${r.lang?" · "+esc(r.lang.toUpperCase()):""}</div>${r.msg?`<div class="small">${esc(r.msg)}</div>`:""}</div>
        <button class="btn sm" data-req-make="${esc(r.id)}">Create account</button><button class="btn sm ghost" data-req-done="${esc(r.id)}">Done</button></div>`).join("")}</div>`:`<p class="muted small" style="margin:0">No new requests.</p>`}</section>`;
  wireInvites(box);
  const lf=$("#log-filter");lf.value=logFilter;lf.onchange=()=>{logFilter=lf.value;logShown=40;drawLog(log,U)};
  drawLog(log,U);
  const again=(n,r)=>{drawAdmin(n,r);adminNav()};
  const call=async(path,body)=>{try{return await api(path,{method:"POST",body})}catch(e){toast(e.message);return null}};
  $$("[data-dev]",box).forEach(b=>{const run=async()=>{if(await call("/admin/device",{username:b.dataset.u,id:b.dataset.id,action:b.dataset.dev})){toast(b.dataset.dev==="approve"?"Device approved":b.dataset.dev==="revoke"?"Device switched off":"Device removed");again()}};
    b.onclick=b.dataset.dev==="approve"?run:()=>armDelete(b,run)});
  $$("[data-open]",box).forEach(b=>b.onclick=()=>openSpace(b.dataset.open,b.dataset.name));
  $$("[data-off]",box).forEach(b=>{const run=async()=>{if(await call("/admin/user-state",{username:b.dataset.off,disabled:b.dataset.v==="1"})){toast(b.dataset.v==="1"?"Account switched off":"Account switched on");again()}};
    b.onclick=b.dataset.v==="1"?()=>armDelete(b,run):run});
  $$("[data-pw]",box).forEach(b=>b.onclick=()=>armDelete(b,async()=>{const pw=genPass();
    if(await call("/admin/user",{username:b.dataset.pw,password:pw,reset:true}))again(inviteBox(b.dataset.pw,b.dataset.name,pw))}));
  $$("[data-req-done]",box).forEach(b=>b.onclick=async()=>{if(await call("/admin/request-done",{id:b.dataset.reqDone}))again()});
  $$("[data-req-make]",box).forEach(b=>b.onclick=()=>{const r=reqs.requests.find(x=>x.id===b.dataset.reqMake);if(!r)return;
    $("#a-name").value=r.org;$("#a-user").value=slugUser(r.org);$("#a-pass").value=genPass();$("#a-create").dataset.req=r.id;$("#a-name").scrollIntoView({block:"center"});$("#a-name").focus()});
  let typed=false;
  $("#a-user").oninput=()=>{typed=true};
  $("#a-name").oninput=()=>{if(!typed)$("#a-user").value=slugUser($("#a-name").value)};
  $("#a-gen").onclick=()=>{$("#a-pass").value=genPass()};
  if(fromReq)$("#a-create").dataset.req=fromReq;
  $("#a-create").onclick=async e=>{
    const name=$("#a-name").value.trim(),username=$("#a-user").value.trim().toLowerCase(),password=$("#a-pass").value,req=e.currentTarget.dataset.req;
    if(!name||!username||!password){toast("Fill in a name, a username and a password");return}
    const r=await call("/admin/user",{name,username,password});if(!r)return;
    if(req)await call("/admin/request-done",{id:req});
    toast("Account created");again(inviteBox(r.user.username,r.user.name,password));
  };
}

/* ---------- start ---------- */
start();
})();
</script>
</body>
</html>
