<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GEMBALL · Where football's gems are found</title>
<meta name="description" content="GEMBALL: the private scouting platform for academy football. Squads, match video and highlight reels in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d10'/%3E%3Cpath d='M9.8 7.4H22.2L27 13.1 16 26.1 5 13.1Z' fill='%23c8f43c' fill-opacity='.25' stroke='%23c8f43c' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M5 13.1H27M12.6 13.1 16 7.4 19.4 13.1 16 26.1 12.6 13.1' fill='none' stroke='%23c8f43c' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* GEMBALL: sports-tech scouting desk. Ink-black chrome, clean white work surfaces, electric-lime signal colour */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --ink:#0b0d10; --muted:#5d636b; --line:#e1e4dc;
  --bar:#0b0d10; --bar-ink:#f4f5f1; --bar-muted:#8d949c;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#eef9cf; --ok:#2f7d1f; --danger:#c0362c; --link:#3b6f00;
  --gold:#c8f43c;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --shadow:0 1px 2px rgba(11,13,16,.04),0 10px 30px -18px rgba(11,13,16,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08090b; --surface:#111418; --sunk:#050607; --ink:#eef0ea; --muted:#8e959d; --line:#1f242a;
  --bar:#050607; --bar-ink:#eef0ea; --bar-muted:#7c838b;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#1f2810; --ok:#8fe06a; --danger:#ff8a80; --link:#c8f43c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090b; --surface:#111418; --sunk:#050607; --ink:#eef0ea; --muted:#8e959d; --line:#1f242a;
  --bar:#050607; --bar-ink:#eef0ea; --bar-muted:#7c838b;
  --accent:#c8f43c; --accent-ink:#0b0d10; --accent-soft:#1f2810; --ok:#8fe06a; --danger:#ff8a80; --link:#c8f43c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7); color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.topbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.topbar .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.logo{color:var(--bar-ink);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.18em;line-height:1}
.logo small{display:block;font-size:.62rem;letter-spacing:.06em;color:var(--bar-muted);margin-top:4px}
.navlinks a[aria-current="page"]{color:var(--accent-ink)!important;background:var(--accent)!important}
.search{position:relative;flex:1;min-width:200px;max-width:440px}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--bar-ink);border-radius:8px;padding:8px 12px;font:inherit}
.search input::placeholder{color:var(--bar-muted)}
.results{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:inherit;text-decoration:none}
.results a:hover,.results a:focus{background:var(--sunk)}
.results .h{font-size:.75rem;color:var(--muted);padding:8px 12px 2px;letter-spacing:.04em}
.navlinks{display:flex;gap:4px;margin-inline-start:auto}
.navlinks a,.navlinks button{color:var(--bar-muted);text-decoration:none;font:inherit;font-weight:600;padding:6px 10px;border-radius:6px;background:none;border:0;cursor:pointer;white-space:nowrap}
.navlinks a[aria-current="page"],.navlinks a:hover,.navlinks button:hover{color:var(--bar-ink);background:rgba(255,255,255,.08)}
.crumbs{background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs .wrap{padding-block:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.crumbs a{color:var(--link);text-decoration:none}
.crumbs span.sep{color:var(--muted)}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
h1{font-size:2.4rem} h2{font-size:1.35rem}
h3{font-size:1rem;margin:0;font-weight:600}
.eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel.sub{background:var(--bg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=color]{padding:2px;height:40px;width:56px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:8px 16px;transition:border-color .15s,background .15s,transform .15s;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary .kbd{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger:hover,.btn.armed{color:var(--danger)}
.btn.big{font-size:1.05rem;padding:11px 18px}
.btn.sm{font-size:.85rem;padding:4px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.ex{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;white-space:nowrap}
.kbd{font-family:var(--f-num);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
/* flags, crests, kits */
.flag{width:48px;aspect-ratio:4/3;border-radius:5px;overflow:hidden;flex:none;display:inline-block;position:relative;box-shadow:0 1px 2px rgba(10,20,35,.18),0 0 0 1px rgba(10,20,35,.08);vertical-align:middle;background:var(--sunk)}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.08));pointer-events:none}
.flag.sm{width:22px;border-radius:3px}
.flag.lg{width:112px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.15)}
.crest{width:44px;height:44px;flex:none;display:inline-grid;place-items:center}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.sm{width:28px;height:28px}
.crest.lg{width:84px;height:84px}
.mf-hint{display:block}.mf-hint .tag{display:inline-block;max-width:100%;white-space:normal;position:static;margin-top:4px}
.kit{--k:#444;--kt:#fff;--ks:#999;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:7px 7px 12px 12px;background:var(--k);color:var(--kt);border:3px solid var(--ks);font-family:var(--f-num);font-weight:500;font-size:.95rem;flex:none}
/* country grid */
.countries{display:grid;gap:14px 10px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.country{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px 8px;border-radius:12px;text-decoration:none;color:var(--ink);text-align:center;font-size:.9rem;font-weight:600;line-height:1.25;position:relative;transition:background .15s}
.country .flag{width:84px;border-radius:8px;transition:transform .18s ease,box-shadow .18s ease}
.country:hover{background:var(--surface)}
.country:hover .flag{transform:translateY(-3px);box-shadow:0 10px 20px rgba(10,20,35,.22),0 0 0 1px rgba(10,20,35,.08)}
.country .badge{position:absolute;top:2px;inset-inline-end:8px;z-index:1;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:.72rem;border-radius:999px;min-width:22px;padding:1px 6px;box-shadow:0 0 0 2px var(--bg)}
.country small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.mycountries{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr))}
.mycountry{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.mycountry:hover{border-color:var(--accent);transform:translateY(-2px)}
.mycountry .flag{width:76px;border-radius:8px}
.mycountry b{font-size:1.08rem;display:block}
.mycountry .mini{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.82rem}
.mycountry .mini span b{display:inline;font-family:var(--f-num);font-size:.9rem;color:var(--ink);font-weight:500}
.mycountry .wash{position:absolute;inset:0 auto 0 0;width:45%;opacity:.13;background-size:cover;background-position:center;filter:blur(14px) saturate(1.3);pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent)}
.band{position:relative;overflow:hidden;border-radius:22px;background:var(--bar);color:var(--bar-ink);padding:34px 30px}
/* scouting-radar backdrop: a lime glow over a fine data grid */
.band::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 88% 10%,rgba(200,244,60,.28),transparent 60%),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px;pointer-events:none}
.band::after{content:"";position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;border-radius:50%;border:2px solid rgba(200,244,60,.25);box-shadow:0 0 0 40px rgba(200,244,60,.05),0 0 0 80px rgba(200,244,60,.03);pointer-events:none}
.band .eyebrow{color:var(--accent)!important}
.band h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.band h1 span{color:var(--accent)}
.band .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.2);opacity:.45;pointer-events:none}
.band .bg+.shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(6,12,10,.9),rgba(6,12,10,.35));pointer-events:none}
.band>.in{position:relative;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.band .eyebrow{color:var(--bar-muted)}
.band h1{color:#fff}
.band .stats .v{color:#fff}.band .stats .l{color:var(--bar-muted)}
.band .grow{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.band .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.band .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip .flag{width:30px;border-radius:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* cards & lists */
a.card{text-decoration:none;color:inherit}
a.card:hover,button.card:hover{border-color:var(--accent)}
button.card{font:inherit;color:inherit;text-align:inherit;cursor:pointer}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .grow b,.item .grow span{overflow-wrap:anywhere}
a.item{color:inherit;text-decoration:none}
a.item:hover b{color:var(--link)}
.chip{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{cursor:default}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side b{overflow-wrap:anywhere}
.score{font-family:var(--f-num);font-size:1.4rem}
.vsw{font-family:var(--f-display);font-size:1.1rem}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.video-box iframe,.video-box .ytslot{position:absolute;inset:0;width:100%;height:100%;border:0}
.srcswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srcswitch button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:5px 10px;cursor:pointer}
.srcswitch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .meta{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-num);font-size:1.5rem}
.stat .l{font-size:.8rem;color:var(--muted)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:start;padding:8px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;border-top:0}
td a{color:var(--link);text-decoration:none;font-weight:600}
/* match room */
.stage{display:grid;gap:16px;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
section.stack{gap:12px}
.video-box{background:#000;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.video-box video{width:100%;height:100%;display:block;background:#000}
.video-box .empty{color:#d4dbe4;text-align:center;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:460px}
.timeline{direction:ltr;position:relative;height:30px;background:var(--sunk);border-radius:6px;cursor:pointer;overflow:hidden}
.timeline .mk{position:absolute;top:5px;bottom:5px;min-width:4px;border-radius:3px;opacity:.9}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.timeline .sel{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.3}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--f-num);font-size:1.15rem;background:var(--sunk);padding:6px 12px;border-radius:8px}
.roster{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:440px){.roster{grid-template-columns:1fr}}
.roster .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.pbtn{font:inherit;display:flex;gap:8px;align-items:center;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:start;min-width:0}
.pbtn span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.io{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.io .t{font-family:var(--f-num);font-size:1.1rem}
.stars button{font:inherit;font-size:1.2rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--accent)}
.rating{color:var(--accent);letter-spacing:1px}
/* reel preview */
.overlay{position:absolute;inset:auto 0 0 0;padding:12px 14px;display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));color:#fff;pointer-events:none}
.overlay .who{display:flex;flex-direction:column;line-height:1.2}
.overlay .who b{font-size:1.2rem}
.overlay .count{margin-inline-start:auto;font-family:var(--f-num)}
.overlay .act{position:absolute;bottom:calc(100% - 4px);inset-inline-start:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,10,18,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal .panel{width:min(720px,100%);max-height:90vh;overflow:auto}
.modal .panel.wide{width:min(1060px,100%)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
textarea{font:inherit;width:100%;resize:vertical}
.review{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.thumbs{display:flex;flex-direction:column;gap:8px;width:220px;max-width:100%;position:sticky;top:0}
.thumbs img{border-radius:8px;border:1px solid var(--line);display:block}
table.imp{min-width:560px}
table.imp td{padding:4px 6px}
table.imp input,table.imp select{width:100%;padding:5px 8px}
table.imp input.n{width:64px}table.imp input.y{width:84px}
table.imp tr.off td{opacity:.45}
.tag{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.new{color:var(--ok);border:1px solid var(--ok)}
.tag.upd{color:var(--accent);border:1px solid var(--accent)}
/* record-to-tag */
.btn.rec{background:#e5383b;border-color:#e5383b;color:#fff}
.btn.rec:hover{border-color:#b9262a;filter:brightness(1.05)}
.btn.rec.on{background:#111;border-color:#e5383b;color:#fff;box-shadow:0 0 0 3px rgba(229,56,59,.35)}
.btn.rec .kbd{background:transparent;color:inherit;border-color:currentColor}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.btn.rec.on .dot,.recbadge .dot,.recpanel .dot{background:#e5383b;animation:recblink 1s steps(2) infinite}
.recbadge{position:absolute;top:12px;left:12px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.72);color:#fff;font:700 .85rem var(--f-num);padding:5px 11px;border-radius:999px;pointer-events:none}
.recpanel{display:flex;flex-direction:column;gap:12px}
.recpanel .row b{font-size:1.1rem}.recpanel .rec-time{font-size:1.6rem;margin-inline-start:auto}
@keyframes recblink{50%{opacity:.25}}
.tag.wait{color:var(--muted);border:1px dashed var(--muted);display:inline-block;margin-top:4px}
.stat .l{text-transform:uppercase;letter-spacing:.12em;font-size:.68rem!important}
.tabs button{text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.modal canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const CN=Object.fromEntries(COUNTRIES.map(c=>[c[0],c[1]]));
/* stored keys stay as before (DM, AM…) so saved players keep their position; what is shown is the scouting code */
const POS=[["GK","GK"],["RB","RB"],["CB","CB"],["LB","LB"],["DM","CDM"],["CM","CM"],["AM","CAM"],["RW","RW"],["LW","LW"],["ST","ST"]];
const POSL=Object.fromEntries(POS);
const POS_FULL={GK:"Goalkeeper",RB:"Right Back",CB:"Centre Back",LB:"Left Back",DM:"Defensive Midfielder",CM:"Central Midfielder",AM:"Attacking Midfielder",RW:"Right Winger",LW:"Left Winger",ST:"Striker"};
const posOption=(k,sel)=>`<option value="${k}" ${k===sel?"selected":""}>${POSL[k]} · ${POS_FULL[k]}</option>`;
const ACTIONS=["Goal","Assist","Dribble","Key Pass","Shot","Tackle / Interception","Header","Save","Sprint","Defending","Other"];
/* data saved by the earlier Hebrew version */
const LEGACY={"גול":"Goal","בישול":"Assist","דריבל":"Dribble","מסירת מפתח":"Key Pass","בעיטה":"Shot","חטיפה/תיקול":"Tackle / Interception","משחק ראש":"Header","הצלה":"Save","ספרינט":"Sprint","הגנה":"Defending","אחר":"Other","ימין":"Right","שמאל":"Left","שתיים":"Both"};
const footL=f=>LEGACY[f]||f||"";
/* the example academies are no longer used: drop them, and anything that only belonged to them */
function dropExamples(){
  const n=S.teams.length+S.players.length+S.matches.length+S.clips.length;
  S.teams=S.teams.filter(t=>!t.example);
  const tids=new Set(S.teams.map(t=>t.id));
  S.players=S.players.filter(p=>!p.example&&tids.has(p.teamId));
  S.matches=S.matches.filter(m=>!m.example&&tids.has(m.homeId)&&tids.has(m.awayId));
  const mids=new Set(S.matches.map(m=>m.id)),pids=new Set(S.players.map(p=>p.id));
  S.clips=S.clips.filter(c=>!c.example&&mids.has(c.matchId)&&pids.has(c.playerId));
  return n!==S.teams.length+S.players.length+S.matches.length+S.clips.length;
}
function englishize(){let ch=dropExamples()?1:0;S.clips.forEach(c=>{if(LEGACY[c.action]){c.action=LEGACY[c.action];ch++}});S.players.forEach(p=>{if(LEGACY[p.foot]){p.foot=LEGACY[p.foot];ch++}});
  const heb=s=>/[֐-׿]/.test(s||"");
  S.teams.forEach(t=>{if(t.example&&heb(t.name)){t.name=t.id==="ex-a"?"Example Academy A":"Example Academy B";t.city=t.id==="ex-a"?"Lagos":"Accra";ch++}});
  S.players.forEach(p=>{if(p.example&&heb(p.name)){p.name="Example Player "+p.name.replace(/[^\d]/g,"")+(p.teamId==="ex-b"?"B":"");ch++}});
  S.matches.forEach(m=>{if(m.example&&heb(m.competition)){m.competition="Example match U17";ch++}});
  S.clips.forEach(c=>{if(c.example&&heb(c.note))c.note=""});
  if(ch)save()}
/* teams added from a video title start empty: flag them until a squad arrives */
const awaiting=t=>t&&!t.example&&!S.players.some(p=>p.teamId===t.id);
const awaitTag=t=>awaiting(t)?'<span class="tag wait">Awaiting info</span>':"";

const $=(s,el=document)=>el.querySelector(s);

const byId=(col,id)=>S[col].find(x=>x.id===id);

function fmt(t,dec){t=Math.max(0,t||0);const whole=Math.floor(t),h=Math.floor(whole/3600),m=Math.floor(whole%3600/60),s=whole%60;let out=(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");if(dec)out+="."+Math.floor((t-whole)*10);return "\u2066"+out+"\u2069"}
function lum(hex){const h=(hex||"#000").replace("#","");const n=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*n[0]+.7152*n[1]+.0722*n[2]}
const textOn=hex=>lum(hex)>.45?"#111111":"#ffffff";
const flagUrl=(c,w=80)=>`https://flagcdn.com/w${w}/${c}.png`;

const flag=(c,cls="")=>c?`<span class="flag ${cls}"><img src="${flagSrc(c)}" alt=""></span>`:"";
function kit(team,num){const p=team?.primary||"#555555",s=team?.secondary||"#bbbbbb";return `<span class="kit" style="--k:${esc(p)};--kt:${textOn(p)};--ks:${esc(s)}">${esc(num??"–")}</span>`}
function initials(name){return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("")}
function crestSvg(team){const p=team?.primary||"#666",s=team?.secondary||"#ccc";

function resizeImage(file,max=200){
  return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/png"))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url});
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Saving in this browser failed. Export a backup so you don't lose data")}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){Object.assign(S,JSON.parse(raw));S.settings=S.settings||{brand:"",contact:""};return}}catch(e){}
  try{const old=localStorage.getItem("academy-vault-v2");if(old){migrate(JSON.parse(old));save();return}}catch(e){}
  save(); /* a new browser starts with an empty platform; no example academies */
}
function migrate(o){
  const byName=Object.fromEntries(COUNTRIES.map(c=>[c[1],c[0]]));
  S.teams=(o.teams||[]).map(t=>({...t,country:byName[t.country]||"",countryText:t.country||""}));
  S.players=o.players||[];
  S.matches=(o.matches||[]).map(m=>({...m,source:"file"}));
  S.clips=o.clips||[];
}
function add(col,data){const row={id:uid(),createdAt:Date.now(),...data};S[col].push(row);save();refresh();return row}
function upd(col,id,data){const r=byId(col,id);if(!r)return;Object.assign(r,data);save();refresh()}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(col==="teams"){const ps=S.players.filter(p=>p.teamId===id).map(p=>p.id);S.players=S.players.filter(p=>p.teamId!==id);S.clips=S.clips.filter(c=>!ps.includes(c.playerId));
    const ms=S.matches.filter(m=>m.homeId===id||m.awayId===id).map(m=>m.id);S.matches=S.matches.filter(m=>!ms.includes(m.id));S.clips=S.clips.filter(c=>!ms.includes(c.matchId))}
  if(col==="players")S.clips=S.clips.filter(c=>c.playerId!==id);
  if(col==="matches")S.clips=S.clips.filter(c=>c.matchId!==id);
  save();refresh();
}

/* restoring a backup adds to what is here and never deletes: the same team, player, match or clip is
   recognised by id (or by name / video) and only its missing details are filled in */
const UNDO_KEY=KEY+"-undo";
const hasUndo=()=>{try{return !!localStorage.getItem(UNDO_KEY)}catch(e){return false}};
function keepUndo(){try{localStorage.setItem(UNDO_KEY,JSON.stringify({at:Date.now(),data:S}))}catch(e){}}
function fillMissing(dst,src){Object.keys(src).forEach(k=>{if((dst[k]==null||dst[k]==="")&&src[k]!=null&&src[k]!=="")dst[k]=src[k]})}
function mergeData(d){
  const tmap={},pmap={},mmap={},n={teams:0,players:0,matches:0,clips:0};
  d.teams.forEach(t=>{const hit=S.teams.find(x=>x.id===t.id)||(!t.example&&S.teams.find(x=>!x.example&&teamScore(x.name,t.name)>=.9));
    if(hit){fillMissing(hit,t);tmap[t.id]=hit.id}else{S.teams.push({...t});tmap[t.id]=t.id;n.teams++}});
  d.players.forEach(p=>{const q={...p,teamId:tmap[p.teamId]||p.teamId};
    const hit=S.players.find(x=>x.id===p.id)||S.players.find(x=>x.teamId===q.teamId&&nameKey(x.name)&&nameKey(x.name)===nameKey(q.name));
    if(hit){fillMissing(hit,q);pmap[p.id]=hit.id}else{S.players.push(q);pmap[p.id]=p.id;n.players++}});
  d.matches.forEach(m=>{const q={...m,homeId:tmap[m.homeId]||m.homeId,awayId:tmap[m.awayId]||m.awayId};
    const hit=S.matches.find(x=>x.id===m.id)||(m.ytId&&S.matches.find(x=>x.ytId===m.ytId));
    if(hit){fillMissing(hit,q);mmap[m.id]=hit.id}else{S.matches.push(q);mmap[m.id]=m.id;n.matches++}});
  d.clips.forEach(c=>{const q={...c,matchId:mmap[c.matchId]||c.matchId,playerId:pmap[c.playerId]||c.playerId,teamId:tmap[c.teamId]||c.teamId};
    if(!S.clips.some(x=>x.id===c.id||(x.matchId===q.matchId&&x.playerId===q.playerId&&Math.abs(x.start-q.start)<.5))){S.clips.push(q);n.clips++}});
  if(d.settings)fillMissing(S.settings,d.settings);
  return n;
}
function undoRestore(){
  let u=null;try{u=JSON.parse(localStorage.getItem(UNDO_KEY))}catch(e){}
  if(!u||!u.data)return;
  Object.assign(S,{teams:u.data.teams,players:u.data.players,matches:u.data.matches,clips:u.data.clips,settings:u.data.settings||S.settings});
  try{localStorage.removeItem(UNDO_KEY)}catch(e){}
  save();closeModal();refresh(true);toast("Back to how it was before the last restore");
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{let d;try{const j=JSON.parse(r.result);d=j.data||j;
      if(!Array.isArray(d.teams)||!Array.isArray(d.players)||!Array.isArray(d.matches)||!Array.isArray(d.clips))throw 0;
      if(!j.version||j.version<3){const cur=JSON.parse(JSON.stringify(S));migrate(d);d={teams:S.teams,players:S.players,matches:S.matches,clips:S.clips};Object.assign(S,cur)}
    }catch(e){toast(`That file doesn't look like a ${BRAND} backup`);return}
    keepUndo();const n=mergeData(d);englishize();save();closeModal();refresh(true);
    toast(`Backup merged: ${n.teams} teams, ${n.players} players, ${n.matches} matches added. Nothing was removed`)};
  r.readAsText(file);
}

/* ---------- video files: remembered handles where the browser allows ---------- */
const IDB={
  _db:null,
  open(){if(this._db)return Promise.resolve(this._db);return new Promise((res,rej)=>{try{const r=indexedDB.open("academy-vault-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>{this._db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){try{const db=await this.open();return await new Promise((res)=>{const q=db.transaction("h").objectStore("h").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();await new Promise(res=>{const tx=db.transaction("h","readwrite");tx.objectStore("h").put(v,k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}
};
function attachFile(m,f){
  if(videoMap[m.id])URL.revokeObjectURL(videoMap[m.id]);
  videoMap[m.id]=URL.createObjectURL(f);
  if(m.fileName&&m.fileName!==f.name)toast("Note: this file differs from the one attached last time ("+m.fileName+")");
  if(current===Match&&route.id===m.id)Match.src="file";
  upd("matches",m.id,{fileName:f.name,fileSize:f.size});
}
async function pickVideo(m){
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:[{description:"Video",accept:{"video/*":[".mp4",".mov",".m4v",".webm",".mkv",".avi"]}}]});
      const f=await h.getFile();await IDB.set(m.id,h);attachFile(m,f);return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  const inp=document.createElement("input");inp.type="file";inp.accept="video/*";
  inp.onchange=()=>{const f=inp.files[0];if(f)attachFile(m,f)};inp.click();
}
async function tryRestore(m){
  if(videoMap[m.id])return"ok";
  const h=await IDB.get(m.id);if(!h||!h.queryPermission)return"none";
  try{const p=await h.queryPermission({mode:"read"});if(p==="granted"){attachFile(m,await h.getFile());return"ok"}return"prompt"}catch(e){return"none"}
}
async function reconnect(m){
  const h=await IDB.get(m.id);if(!h){pickVideo(m);return}
  try{if(await h.requestPermission({mode:"read"})==="granted"){attachFile(m,await h.getFile());return}}catch(e){}
  pickVideo(m);
}

/* ---------- YouTube ---------- */
function ytId(url){
  try{const u=new URL(String(url).trim());const h=u.hostname.replace(/^(www|m|music)\./,"");
    if(h==="youtu.be")return u.pathname.slice(1).split("/")[0]||null;
    if(h.endsWith("youtube.com")||h.endsWith("youtube-nocookie.com")){
      if(u.searchParams.get("v"))return u.searchParams.get("v");
      const m=u.pathname.match(/\/(embed|live|shorts|v)\/([\w-]{6,})/);if(m)return m[2];}
  }catch(e){}
  const m=String(url||"").trim().match(/^[\w-]{11}$/);return m?m[0]:null;
}
const ytLink=(id,t)=>`https://youtu.be/${id}${t?"?t="+Math.floor(t):""}`;
let ytPromise=null;
function loadYT(){
  if(ytPromise)return ytPromise;
  ytPromise=new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player)return res(window.YT);
    const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();res(window.YT)};
    const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.referrerPolicy="strict-origin-when-cross-origin";s.onerror=()=>{ytPromise=null;rej()};document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),20000);
  });
  return ytPromise;
}
const YT_ERR={2:"Invalid video ID",5:"The video isn't supported by the player",100:"The video doesn't exist, was deleted or is private",101:"The owner has blocked embedding on other sites",150:"The owner has blocked embedding on other sites",152:"The owner has blocked embedding on other sites",153:"YouTube rejected this site's address (error 153)"};
/* wraps a YouTube player so it behaves like a <video> element */
const webOrigin=()=>/^https?:$/.test(location.protocol)&&location.origin&&location.origin!=="null";
function whereNow(){return location.protocol==="file:"?"a local file (file://)":webOrigin()?location.host:"a preview window ("+(location.protocol||"no address")+")"}
/* builds the embed iframe ourselves so the referrer policy is set before it loads, then wraps it like a <video> */
function makeYT(el,videoId,onErr){
  if(!webOrigin())return Promise.reject(new Error("env"));
  return loadYT().then(YT=>new Promise((res,rej)=>{
    let ready=false;
    const f=document.createElement("iframe");
    f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title="YouTube player";
    f.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0";
    f.src=`https://www.youtube.com/embed/${encodeURIComponent(videoId)}?enablejsapi=1&rel=0&playsinline=1&modestbranding=1&origin=${encodeURIComponent(location.origin)}&widget_referrer=${encodeURIComponent(location.href.split("#")[0])}`;
    el.replaceWith(f);
    const p=new YT.Player(f,{events:{onReady:()=>{ready=true;res(wrap)},
      onError:e=>{const msg=YT_ERR[e.data]||("YouTube player error ("+e.data+")");onErr&&onErr(msg,e.data);if(!ready)rej(new Error(msg))}}});
    const wrap={isYT:true,yt:p,
      get currentTime(){try{return p.getCurrentTime()||0}catch(e){return 0}},
      set currentTime(t){try{p.seekTo(t,true)}catch(e){}},
      get duration(){try{return p.getDuration()||0}catch(e){return 0}},
      get paused(){try{const st=p.getPlayerState();return st!==1&&st!==3}catch(e){return true}},
      get ended(){try{return p.getPlayerState()===0}catch(e){return false}},
      play(){try{p.playVideo()}catch(e){}return Promise.resolve()},
      pause(){try{p.pauseVideo()}catch(e){}},
      load(id,start){p.loadVideoById({videoId:id,startSeconds:start||0})},
      videoId(){try{return p.getVideoData().video_id}catch(e){return null}},
      addEventListener(){},
      destroy(){try{p.destroy()}catch(e){}try{f.remove()}catch(e){}}};
  }));
}

/* ---------- router ---------- */
let route={};
function parse(){const p=(location.hash.replace(/^#\/?/,"")||"").split("/").map(decodeURIComponent);return{view:p[0]||"home",id:p[1]||null}}
const nav=(view,id)=>{location.hash="#/"+view+(id?"/"+encodeURIComponent(id):"")};
window.addEventListener("hashchange",()=>refresh(true));
let current=null;
function refresh(full){
  const r=parse();
  const changed=full||r.view!==route.view||r.id!==route.id;
  route=r;
  if(changed){
    if(current&&current.unmount)current.unmount();
    current=VIEWS[route.view]||VIEWS.home;
    $("#root").innerHTML="";
    current.mount($("#root"));
    window.scrollTo(0,0);
  }
  current.update();
  $("#nav-home").toggleAttribute("aria-current",route.view==="home"||route.view==="country");
  if(route.view==="home"||route.view==="country")$("#nav-home").setAttribute("aria-current","page");
  $("#nav-hl").toggleAttribute("aria-current",route.view==="highlights");
  if(route.view==="highlights")$("#nav-hl").setAttribute("aria-current","page");
}

/* ---------- reading the two teams out of a YouTube video ---------- */
async function ytMeta(id){
  const url=encodeURIComponent("https://www.youtube.com/watch?v="+id);
  for(const api of[`https://www.youtube.com/oembed?format=json&url=${url}`,`https://noembed.com/embed?url=${url}`]){
    try{const r=await fetch(api);if(r.ok){const j=await r.json();if(j.title)return j}}catch(e){}
  }
  throw new Error("no metadata");
}
function loadThumb(id){
  const one=q=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>i.naturalWidth>120?res(i):rej();i.onerror=rej;i.src=`https://i.ytimg.com/vi/${id}/${q}.jpg`});
  return one("maxresdefault").catch(()=>one("hqdefault")).catch(()=>null);
}
const TITLE_NOISE=/(?<![\p{L}\d])(highlights?|תקציר|משחק מלא|full ?match|full ?game|extended|r[eé]sum[eé]|buts|goals?|gols|melhores momentos|live|en direct|direct|replay|hd|4k|match complet|partido completo|official|video|vid[eé]o|amical|friendly|amistoso|game|match|partido|jogo|n[°o]? ?\d+)(?![\p{L}\d])/giu;
const pad2=n=>String(n).padStart(2,"0");
function cleanTeam(s){
  return String(s||"").replace(TITLE_NOISE," ").replace(/\b(U|SUB|U-)\s?\d{1,2}\b/gi," ").replace(/\b(19|20)\d\d\b/g," ")
    .replace(/^[\s\-–—:,.!?'"«»]+|[\s\-–—:,.!?"«»]+$/g,"").replace(/\s+/g," ").trim().split(" ").map(teamCase).join(" ");
}
/* "DREAM TEAM FC" → "Dream Team FC": shouting titles become names, short club initials stay capitals */
function teamCase(w){
  if(w!==w.toUpperCase()||!/\p{Lu}/u.test(w))return w;
  return w.replace(/[.\-]/g,"").length<=3?w:w.charAt(0)+w.slice(1).toLowerCase().replace(/([\-'’])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
}
function parseMatchTitle(title){
  const r={home:"",away:"",homeScore:null,awayScore:null,date:"",competition:""};
  let s=String(title||"").replace(/[\u{1F000}-\u{1FAFF}☀-➿️]/gu," ").replace(/\((\d{1,2})\)/g," $1 ").replace(/\s+/g," ").trim();
  let m=s.match(/\b(20\d\d)[-./](\d{1,2})[-./](\d{1,2})\b/);
  if(m){r.date=`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;s=s.replace(m[0]," ")}
  else if((m=s.match(/\b(\d{1,2})[-./](\d{1,2})[-./](20\d\d|\d\d)\b/))){r.date=`${m[3].length===2?"20"+m[3]:m[3]}-${pad2(m[2])}-${pad2(m[1])}`;s=s.replace(m[0]," ")}
  const segs=s.split(/\s*[|•·｜#\[\]]\s*|\s+\/\s+|:\s+|\s*[()]\s*/).map(x=>x.trim()).filter(Boolean);
  const SCORE=/^(.*?\D)\s*\b(\d{1,2})\s*[-–:]\s*(\d{1,2})\b\s*(\D.*)$/,VS=/^(.+?)\s+(?:vs\.?|v\.?|versus|x|contre|נגד|gegen|contra)\s+(.+)$/i,DASH=/^(.+?)\s+[-–—]\s+(.+)$/;
  let hit=-1;
  for(const re of[SCORE,VS,DASH]){hit=segs.findIndex(x=>re.test(x));if(hit<0)continue;
    const g=segs[hit].match(re);
    if(re===SCORE){r.home=g[1];r.homeScore=+g[2];r.awayScore=+g[3];r.away=g[4]}else{r.home=g[1];r.away=g[2];
      /* "A vs B 2-2" or "A 2 vs 1 B" */
      let sm=r.away.match(/\s(\d{1,2})\s*[-–:]\s*(\d{1,2})\s*$/);
      if(sm){r.homeScore=+sm[1];r.awayScore=+sm[2];r.away=r.away.slice(0,sm.index)}
      else if((sm=r.home.match(/\s(\d{1,2})$/))&&/^\d{1,2}\s/.test(r.away)){r.homeScore=+sm[1];r.home=r.home.slice(0,sm.index);r.awayScore=parseInt(r.away);r.away=r.away.replace(/^\d{1,2}\s+/,"")}}
    break}
  if(hit<0)return r;
  r.away=r.away.split(/\s+[-–—]\s+/)[0];r.home=r.home.split(/\s+[-–—]\s+/).pop();
  r.home=cleanTeam(r.home);r.away=cleanTeam(r.away);
  r.competition=segs.filter((x,i)=>i!==hit).map(x=>x.replace(TITLE_NOISE," ").replace(/\b(du|de|del|do|da|the|of|en)\s*$/i,"").replace(/\s+/g," ").replace(/^[\s\-–—,.]+|[\s\-–—,.]+$/g,"")).find(x=>x.replace(/[^\p{L}]/gu,"").length>=3)||"";
  if(!r.competition&&/(?<![\p{L}])(amical|friendly|amistoso|amig[aá]vel|test ?match|ידידות)(?![\p{L}])/iu.test(String(title)))r.competition="Friendly";
  return r;
}
/* "ASEC Mimosas U17" and "Asec Mimosas" are the same club; "FC", "Academy" and age groups don't tell clubs apart */
const TEAM_STOP=/^(fc|cf|sc|ac|afc|club|football|futbol|futebol|academy|academie|academia|akademie|the|de|du|des|la|le|el|fa|u\d{1,2}|sub\d{1,2})$/;
const teamTokens=n=>deacc(n).replace(/\bu[\s-]+(\d)/g,"u$1").split(/[^a-z0-9֐-׿]+/).filter(w=>w&&!TEAM_STOP.test(w));
function teamScore(a,b){
  const A=teamTokens(a),B=teamTokens(b);if(!A.length||!B.length)return 0;
  const ka=A.join(""),kb=B.join("");if(ka===kb)return 1;
  if(Math.min(ka.length,kb.length)>=4&&(ka.includes(kb)||kb.includes(ka)))return .9;
  return A.filter(w=>B.some(v=>w===v||(w.length>4&&lev(w,v)<=1))).length/Math.max(A.length,B.length);
}
function findTeam(name){
  let best=null,bs=0;S.teams.forEach(t=>{const sc=teamScore(name,t.name);if(sc>bs){bs=sc;best=t}});
  return bs>=.6?best:null;
}
/* drag a box (or just click) on the video thumbnail around a team's crest */
function openCrestCrop(img,onPick){
  const box=$("#mf-crop");box.hidden=false;
  box.innerHTML=`<div class="panel sub"><div class="spread"><b>Drag a square around the crest (or just click it)</b><button class="btn sm ghost" type="button" id="cr-close">Close</button></div>
    <canvas id="cr-cv" style="width:100%;max-width:640px;touch-action:none;cursor:crosshair;border-radius:8px"></canvas></div>`;
  const cv=$("#cr-cv"),ctx=cv.getContext("2d");cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  let a=null,sel=null;
  const draw=()=>{ctx.drawImage(img,0,0);if(sel){ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,sel.x,sel.y,sel.s,sel.s,sel.x,sel.y,sel.s,sel.s);ctx.strokeStyle="#c8f43c";ctx.lineWidth=Math.max(2,cv.width/300);ctx.strokeRect(sel.x,sel.y,sel.s,sel.s)}};
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  const square=(p,q)=>{let s=Math.max(Math.abs(q.x-p.x),Math.abs(q.y-p.y));
    if(s<cv.height*.03){s=cv.height*.22;return clampSq(p.x-s/2,p.y-s/2,s)}
    return clampSq(q.x<p.x?p.x-s:p.x,q.y<p.y?p.y-s:p.y,s)};
  const clampSq=(x,y,s)=>{s=Math.min(s,cv.width,cv.height);return {x:Math.max(0,Math.min(cv.width-s,x)),y:Math.max(0,Math.min(cv.height-s,y)),s}};
  cv.onpointerdown=e=>{a=pt(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!a)return;sel=square(a,pt(e));draw()};
  cv.onpointerup=e=>{if(!a)return;sel=square(a,pt(e));a=null;draw();
    const out=document.createElement("canvas");out.width=out.height=Math.min(200,Math.round(sel.s));
    out.getContext("2d").drawImage(img,sel.x,sel.y,sel.s,sel.s,0,0,out.width,out.height);
    onPick(out.toDataURL("image/png"));box.hidden=true;box.innerHTML=""};
  $("#cr-close").onclick=()=>{box.hidden=true;box.innerHTML=""};
  draw();box.scrollIntoView({block:"nearest"});
}
function wireMatchForm(onCancel){

      (found.length===2?`Detected: ${esc(g.home)} vs ${esc(g.away)}. Check and fix if needed.`:`Couldn't find both teams in the title. Select them manually.`)+`</span></div>`;

/* ---------- view: match room ---------- */
let tagState=null;
const recording=()=>!!(tagState&&tagState.recording);
const recLabel=()=>recording()?`■ Stop recording <span class="kbd">R</span>`:`<i class="dot"></i> Record <span class="kbd">R</span>`;
const Match={
  v:null,_key:null,_clock:null,_prev:null,
  mount(root){
    tagState=null;
    root.innerHTML=`<div id="m-head"></div>
    <div class="stage">
      <div class="stack">
        <div class="video-box" id="vbox"></div>
        <div class="timeline" id="tl" title="Click to jump"></div>
        <div class="controls" id="ctrl"></div>
      </div>
      <div class="panel" id="tagpanel"></div>
    </div>
    <div class="panel"><div class="spread"><h3>Tagged clips</h3><span class="muted" id="clip-count"></span></div><div class="list" id="clip-list"></div></div>
    <div class="panel"><div class="spread"><h3>Squads</h3><button class="btn ghost danger sm" id="del-match">Delete match</button></div><div class="roster" id="squads"></div></div>`;
    $("#del-match").onclick=e=>armDelete(e.currentTarget,()=>{const m=this.match();const h=m?.homeId;del("matches",route.id);nav(h?"team":"",h)});
    this.src=null;
    $("#tl").onclick=e=>{if(!this.v||!this.v.duration)return;const r=e.currentTarget.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;this.v.currentTime=x*this.v.duration};
    this._key=null;this.v=null;
    clearInterval(this._clock);
    this._clock=setInterval(()=>this.tick(),200);
  },
  unmount(){clearInterval(this._clock);clearInterval(this._prev);if(this.v&&this.v.isYT)this.v.destroy();this.v=null;this.src=null},
  match(){return byId("matches",route.id)},
  tick(){
    const v=this.v;if(!v)return;
    const c=$("#clock");if(c)c.textContent=fmt(v.currentTime,1);
    const ph=$("#tl .ph");if(ph&&v.duration)ph.style.left=(v.currentTime/v.duration*100)+"%";
    if(recording()){
      const el=Math.max(0,v.currentTime-tagState.start),txt=fmt(el);
      $$(".rec-time").forEach(x=>x.textContent=txt);
      const s=$("#tl .sel"),d=v.duration||0;if(s&&d)s.style.width=Math.max(.3,el/d*100)+"%";
    }
  },
  /* one button: start recording when the action begins, stop when it ends, then pick the player */
  toggleRec(){
    if(!this.v)return;const t=this.now();
    if(!recording()){
      tagState={start:t,end:null,playerId:null,action:null,note:"",rating:0,recording:true};
      if(this.v.paused)this.v.play().catch(()=>{});
    }else{
      if(t<=tagState.start+0.5){toast("Recording is too short. Let the action play, then stop");return}
      tagState.end=t;tagState.recording=false;this.v.pause();
    }
    this.syncRec();this.refreshTag();
  },
  syncRec(){
    const b=$("#b-rec");if(b){b.innerHTML=recLabel();b.classList.toggle("on",recording())}
    const box=$("#vbox");if(!box)return;
    let badge=$("#rec-badge",box);
    if(recording()&&!badge){badge=document.createElement("div");badge.id="rec-badge";badge.className="recbadge";badge.innerHTML=`<i class="dot"></i>REC <span class="rec-time">0:00</span>`;box.appendChild(badge)}
    if(!recording()&&badge)badge.remove();
  },
  update(){
    const m=this.match();
    if(!m){crumbs([["Not found",null]]);$("#root").innerHTML=`<div class="panel"><h3>Match not found</h3><a class="btn" href="#/">Back</a></div>`;return}
    const h=byId("teams",m.homeId),a=byId("teams",m.awayId);
    crumbs([[`${flag(h?.country,"sm")} ${esc(CN[h?.country]||"")}`,h?.country?"#/country/"+h.country:null],[esc(h?.name||"?"),h?"#/team/"+h.id:null],[esc(matchLabel(m)),null]]);
    $("#m-head").innerHTML=`<div class="panel"><div class="vs"><a class="side" href="#/team/${esc(h?.id)}" style="color:inherit;text-decoration:none">${crest(h,"lg")}<b>${esc(h?.name)}</b><span class="muted">${flag(h?.country,"sm")} ${esc(CN[h?.country]||"")}</span></a>
      <div style="text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center">${scoreHtml(m)}<span class="muted num">${esc(m.date||"")}</span><span class="muted">${esc(m.competition||"")}</span>${m.example?'<span class="ex">Example</span>':""}</div>
      <a class="side" href="#/team/${esc(a?.id)}" style="color:inherit;text-decoration:none">${crest(a,"lg")}<b>${esc(a?.name)}</b><span class="muted">${flag(a?.country,"sm")} ${esc(CN[a?.country]||"")}</span></a></div></div>`;
    this.buildVideo(m);
    this.renderTimeline(m);
    this.renderTagPanel(m,h,a);
    this.renderClips(m);
    $("#squads").innerHTML=[h,a].map(t=>`<div class="col"><div class="row">${crest(t,"sm")}<b>${esc(t?.name)}</b></div>${playersOf(t?.id).map(p=>`<a class="row" href="#/player/${esc(p.id)}" style="color:inherit;text-decoration:none">${kit(t,p.number)}<span>${esc(p.name)}</span><span class="muted">${esc(POSL[p.position]||"")}</span></a>`).join("")||`<p class="muted">No players in squad. <a href="#/team/${esc(t?.id)}">Add squad</a></p>`}</div>`).join("");
  },
  buildVideo(m){
    if(!this.src||(this.src==="file"&&!videoMap[m.id])||(this.src==="yt"&&!m.ytId))this.src=videoMap[m.id]?"file":m.ytId?"yt":"file";
    const key=[m.id,videoMap[m.id]||"",m.ytId||"",this.src].join("|");
    if(this._key===key)return;this._key=key;
    if(this.v&&this.v.isYT)this.v.destroy();
    this.v=null;
    const box=$("#vbox"),ctrl=$("#ctrl");
    const switcher=(m.ytId&&videoMap[m.id])?`<span class="srcswitch" role="group" aria-label="Video source"><button data-src="file" aria-pressed="${this.src==="file"}">File</button><button data-src="yt" aria-pressed="${this.src==="yt"}">YouTube</button></span>`:"";
    const tools=extra=>`<span class="clock" id="clock">0:00.0</span>
        <button class="btn sm" data-sk="-5" title="Back 5 seconds">−5</button><button class="btn sm" data-sk="-1">−1</button><button class="btn sm" data-sk="1">+1</button><button class="btn sm" data-sk="5">+5</button>
        <button class="btn rec" id="b-rec">${recLabel()}</button>
        <span class="row" style="margin-inline-start:auto">${switcher}${extra}</span>`;
    const wireTools=()=>{
      $$("[data-sk]",ctrl).forEach(b=>b.onclick=()=>{if(this.v)this.v.currentTime=Math.max(0,this.v.currentTime+ +b.dataset.sk)});
      $("#b-rec").onclick=()=>this.toggleRec();
      $$("[data-src]",ctrl).forEach(b=>b.onclick=()=>{const t=this.v?this.v.currentTime:0;this.src=b.dataset.src;this._resume=t;this.buildVideo(m)});
      const sw=$("#b-swap");if(sw)sw.onclick=()=>pickVideo(m);
      const af=$("#b-addfile");if(af)af.onclick=()=>pickVideo(m);
      const cy=$("#b-ytlink");if(cy)cy.onclick=()=>copyText(ytLink(m.ytId,this.v?this.v.currentTime:0),"Link to this moment copied");
      const ey=$("#b-edityt");if(ey)ey.onclick=()=>askYT(m);
      this.syncRec();
    };
    const resume=this._resume;this._resume=null;
    if(this.src==="file"&&videoMap[m.id]){
      box.innerHTML=`<video id="vid" controls playsinline preload="auto" src="${videoMap[m.id]}"></video>`;
      this.v=$("#vid");
      this.v.addEventListener("loadedmetadata",()=>{if(resume)this.v.currentTime=resume;if(Math.abs((m.duration||0)-this.v.duration)>1){m.duration=this.v.duration;save();this.renderTimeline(m)}});
      ctrl.innerHTML=tools(`<button class="btn ghost sm" id="b-swap">Replace file</button>${m.ytId?"":`<button class="btn ghost sm" id="b-edityt">+ YouTube link</button>`}`);
      wireTools();return;
    }
    if(this.src==="yt"&&m.ytId){
      box.innerHTML=`<div class="ytslot" id="yt-slot"></div>`;
      ctrl.innerHTML=`<span class="muted">Loading YouTube player…</span>`;
      const fail=msg=>{if(this._key!==key)return;
        const env=!webOrigin();
        box.innerHTML=`<div class="empty"><b>${env?"YouTube only plays from a web address":"The video didn't load from YouTube"}</b><span>${env?"This page is currently open from: <b dir=\"ltr\">"+esc(whereNow())+"</b>. Open your published site address in Chrome and the video will play here.":esc(msg)+". <span dir=\"ltr\">("+esc(whereNow())+")</span>"}</span><div class="row" style="justify-content:center"><a class="btn" href="${ytLink(m.ytId)}" target="_blank" rel="noopener">Open on YouTube</a><button class="btn primary" id="b-pick">Attach the original file</button></div></div>`;
        ctrl.innerHTML=`<button class="btn ghost sm" id="b-edityt">Change link</button>`;$("#b-pick").onclick=()=>pickVideo(m);$("#b-edityt").onclick=()=>askYT(m);};
      makeYT($("#yt-slot"),m.ytId,msg=>fail(msg)).then(p=>{
        if(this._key!==key){p.destroy();return}
        this.v=p;if(resume)p.currentTime=resume;
        const iv=setInterval(()=>{if(this._key!==key||!this.v){clearInterval(iv);return}const d=p.duration;if(d>0){clearInterval(iv);if(Math.abs((m.duration||0)-d)>1){m.duration=d;save()}this.renderTimeline(m)}},500);
        ctrl.innerHTML=tools(`<button class="btn ghost sm" id="b-ytlink">Copy link to moment</button>${videoMap[m.id]?"":`<button class="btn ghost sm" id="b-addfile">+ Original file</button>`}`);
        wireTools();
      }).catch(e=>fail(e&&e.message&&e.message!=="timeout"&&e.message!=="env"?e.message:"Couldn't load the YouTube player. Check your internet connection"));
      return;
    }
    box.innerHTML=`<div class="empty"><b>Attach the match video</b><span>${m.fileName?"File used last time: <b>"+esc(m.fileName)+"</b>":"Choose a file from your computer or phone (it stays on your device), or paste a YouTube link."}</span>
      <div class="row" style="justify-content:center"><button class="btn primary" id="b-pick">Choose video file</button><button class="btn" id="b-edityt">Paste YouTube link</button></div></div>`;
    ctrl.innerHTML=`<span class="muted">Editing and tagging open once the video is attached.</span>`;
    $("#b-pick").onclick=()=>pickVideo(m);$("#b-edityt").onclick=()=>askYT(m);
    tryRestore(m).then(r=>{
      if(r!=="prompt"||this._key!==key)return;
      $("#b-pick").outerHTML=`<button class="btn primary" id="b-re">Reattach ${esc(m.fileName||"the file")}</button><button class="btn" id="b-pick">Choose another file</button>`;
      $("#b-re").onclick=()=>reconnect(m);$("#b-pick").onclick=()=>pickVideo(m);
    });
  },
  renderTimeline(m){
    const tl=$("#tl");const d=(this.v&&this.v.duration)||m.duration||0;
    if(!d){tl.innerHTML="";return}
    const cs=S.clips.filter(c=>c.matchId===m.id);
    const sel=tagState&&tagState.start!=null?`<div class="sel" style="left:${tagState.start/d*100}%;width:${Math.max(.3,((tagState.end??tagState.start+1)-tagState.start)/d*100)}%"></div>`:"";
    tl.innerHTML=sel+cs.map(c=>{const t=byId("teams",c.teamId);return `<span class="mk" title="${esc((byId("players",c.playerId)?.name||"")+" · "+(c.action||""))}" style="left:${c.start/d*100}%;width:${(c.end-c.start)/d*100}%;background:${esc(t?.primary||"#888")};box-shadow:0 0 0 1px ${esc(t?.secondary||"#fff")}"></span>`}).join("")+`<span class="ph"></span>`;
    this.tick();
  },
  now(){return this.v?this.v.currentTime:0},
  markIn(){if(!this.v)return;const t=this.now();
    if(!tagState)tagState={start:t,end:null,playerId:null,action:null,note:"",rating:0};

  markOut(){if(!this.v)return;const t=this.now();

    else{if(t<=tagState.start){toast("The out point must be after the in point");return}tagState.end=t}
    this.v.pause();this.refreshTag()},
  refreshTag(){const m=this.match();if(!m)return;this.renderTagPanel(m,byId("teams",m.homeId),byId("teams",m.awayId));this.renderTimeline(m);
    if(tagState&&window.innerWidth<900)$("#tagpanel").scrollIntoView({block:"nearest",behavior:"smooth"})},
  renderTagPanel(m,h,a){

          <li>When the action starts, press <b>● Record</b> (<span class="kbd">R</span>).</li>
          <li>When it ends, press <b>■ Stop recording</b> (<span class="kbd">R</span>). The video pauses.</li>
          <li>Pick the player, action and rating, then save (<span class="kbd">Enter</span>).</li></ol>
        <button class="btn rec big" id="tg-rec"><i class="dot"></i> Record</button>
        <p class="muted" style="margin:0">The clip is exactly what you recorded, nothing is added before or after. Keys: <span class="kbd">Space</span> play/pause, <span class="kbd">←</span><span class="kbd">→</span> 5 seconds.</p>
        <div class="stat"><span class="v num">${n}</span><span class="l">Clips in match</span></div>`;
      $("#tg-rec").onclick=()=>this.toggleRec();
      return;
    }

      p.innerHTML=`<div class="recpanel"><div class="row"><i class="dot"></i><b>Recording</b><span class="rec-time num">0:00</span></div>

      $("#tg-cancel").onclick=()=>this.cancelTag();

    const len=ts.end!=null?ts.end-ts.start:null;
    p.innerHTML=`<div class="spread"><h3>${ts.id?"Edit clip":"New clip"}</h3><button class="btn ghost" id="tg-cancel">Cancel <span class="kbd">Esc</span></button></div>

document.addEventListener("keydown",e=>{
  if(current!==Match||!Match.v)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  const v=Match.v;
  switch(e.code){
    case"KeyR":Match.toggleRec();break;
    case"Space":if(e.target===v)return;v.paused?v.play().catch(()=>{}):v.pause();break;
    case"ArrowRight":if(e.target===v)return;v.currentTime=Math.max(0,v.currentTime+(e.shiftKey?1:5));break;
    case"ArrowLeft":if(e.target===v)return;v.currentTime=Math.max(0,v.currentTime-(e.shiftKey?1:5));break;
    case"Escape":if(tagState)Match.cancelTag();else return;break;
    case"Enter":if(tagState&&tagState.playerId&&tagState.end!=null&&e.target.tagName!=="BUTTON")Match.saveTag();else return;break;
    default:return;
  }
  e.preventDefault();
});

    </div>
    <div id="imp-txt" hidden>
      <label class="f">Paste the list (one player per line, e.g. 10 John Mensah MF 2008)<textarea id="imp-text" rows="8" dir="auto"></textarea></label>
      <div class="row"><button class="btn primary" id="imp-parse">Detect players</button></div>
    </div>
    <div id="imp-status"></div>
    <div id="imp-review"></div>`);
  $(".modal .panel").classList.add("wide");
  $$("#imp-tabs button").forEach(b=>b.onclick=()=>{$$("#imp-tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));$("#imp-img").hidden=b.dataset.k!=="img";$("#imp-txt").hidden=b.dataset.k!=="txt"});
  $("#imp-file").onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length)runOCR(fs)};
  const drop=$("#imp-drop");
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));if(fs.length)runOCR(fs)});
  $("#imp-parse").onclick=()=>{const rows=parseSquad($("#imp-text").value);if(!rows.length){toast("No players found in the text");return}imp.rows=rows;renderReview()};
}
async function runOCR(files){
  const st=$("#imp-status");
  st.innerHTML=`<div class="panel sub"><span id="ocr-msg">Loading the text-recognition engine…</span><div class="bar"><i id="ocr-bar"></i></div></div>`;
  let T;try{T=await loadOCR()}catch(e){st.innerHTML=`<div class="notice">Couldn't load the text-recognition engine. Check your internet connection, or paste the list as text.</div>`;return}
  const lang=$("#imp-lang").value;
  let worker;
  try{
    let failed=null;
    const wp=T.createWorker(lang,1,Object.assign({errorHandler:e=>{failed=e},logger:m=>{if(!imp)return;const b=$("#ocr-bar");if(b&&m.status==="recognizing text")b.style.width=Math.round(m.progress*100)+"%";
      const msg=$("#ocr-msg");if(msg)msg.textContent=m.status==="recognizing text"?`Reading text… ${Math.round(m.progress*100)}%`:"Preparing the engine (takes a few seconds the first time)…"}},window.OCR_OPTS||{}));
    worker=await Promise.race([wp,new Promise((_,rej)=>{const t0=Date.now();const iv=setInterval(()=>{if(failed||Date.now()-t0>90000){clearInterval(iv);rej(failed||new Error("timeout"))}},500);wp.then(()=>clearInterval(iv),()=>clearInterval(iv))})]);
    await worker.setParameters({preserve_interword_spaces:"1",tessedit_pageseg_mode:"3"});
    const all=[];
    for(let i=0;i<files.length;i++){
      const {canvas,url}=await prepImage(files[i]);imp.images.push(url);
      const msg=$("#ocr-msg");if(msg)msg.textContent=`Image ${i+1} of ${files.length}…`;
      const {data}=await worker.recognize(canvas,{},{text:true,tsv:true});
      const res=parseOCR(data);
      all.push(...res.rows);
      if(res.cards){/* card grids: a sparse-text pass catches labels the page-layout pass skipped */
        if(msg)msg.textContent=`Image ${i+1} of ${files.length}: second pass over the player cards…`;
        await worker.setParameters({tessedit_pageseg_mode:"11"});
        const r2=parseOCR((await worker.recognize(canvas,{},{text:true,tsv:true})).data);
        await worker.setParameters({tessedit_pageseg_mode:"3"});
        if(r2.cards)all.push(...r2.rows);
      }
    }
    imp.rows=mergeRows(all);
    st.innerHTML=all.length?"":`<div class="notice">No players found in the image. Try a sharper image, crop to just the list, or paste the names as text.</div>`;
    if(all.length)renderReview();
  }catch(e){console.error(e);st.innerHTML=`<div class="notice">Text recognition failed. Try another image or paste the list as text.</div>`}
  finally{if(worker)worker.terminate()}
}
const saveCount=()=>imp.rows.filter(r=>r.include&&r.name.trim()).length;
function renderReview(){
  const t=imp.team,existing=playersOf(t.id);
  const byNum=n=>n!=null&&n!==""?existing.find(p=>+p.number===+n):null;
  const box=$("#imp-review");
  const posOpts=v=>`<option value="">—</option>`+POS.map(([k])=>posOption(k,v)).join("");
  box.innerHTML=`<div class="review">
    ${imp.images.length?`<div class="thumbs">${imp.images.map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Uploaded image"></a>`).join("")}<span class="muted" style="font-size:.8rem">Click to enlarge</span></div>`:""}
    <div style="min-width:0;flex:1">
      <div class="spread"><h3>${imp.rows.length} rows found. Check and fix before saving</h3><button class="btn sm" id="imp-add">+ Row</button></div>
      <div class="scroll-x"><table class="imp"><thead><tr><th></th><th>No.</th><th>Name</th><th>Position</th><th>Born</th><th></th></tr></thead><tbody>
      ${imp.rows.map((r,i)=>{const ex=byNum(r.number);return `<tr class="${r.include?"":"off"}">
        <td><input type="checkbox" data-i="${i}" data-k="include" ${r.include?"checked":""} aria-label="Include"></td>
        <td><input class="n" type="number" min="0" max="99" data-i="${i}" data-k="number" value="${r.number??""}"></td>
        <td><input class="nm" data-i="${i}" data-k="name" value="${esc(r.name)}" dir="auto" placeholder="Name not read, type it in"></td>
        <td><select data-i="${i}" data-k="position">${posOpts(r.position)}</select></td>
        <td><input class="y" type="number" min="1990" max="2022" data-i="${i}" data-k="birthYear" value="${r.birthYear??""}"></td>
        <td>${ex?`<span class="tag upd" title="${esc(ex.name)}">Updates #${esc(ex.number)}</span>`:`<span class="tag new">New</span>`}</td></tr>`}).join("")}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn primary big" id="imp-save">Add ${saveCount()} players to squad</button><span class="muted">A player whose number is already in the squad is updated, not duplicated.</span></div>
    </div></div>`;
  $$("[data-k]",box).forEach(el=>el.onchange=()=>{const r=imp.rows[+el.dataset.i],k=el.dataset.k;
    if(k==="include")r.include=el.checked;else if(k==="number"||k==="birthYear")r[k]=el.value===""?null:+el.value;else r[k]=el.value;
    if(k==="include"||k==="number")renderReview();else{const s=$("#imp-save");s.textContent=`Add ${saveCount()} players to squad`}});
  $("#imp-add").onclick=()=>{imp.rows.push({include:true,number:null,name:"",position:"",birthYear:null});renderReview();const ins=$$(".imp .nm");ins[ins.length-1].focus()};
  $("#imp-save").onclick=()=>{
    let added=0,updated=0;
    imp.rows.filter(r=>r.include&&r.name.trim()).forEach(r=>{
      const ex=byNum(r.number);
      const data={name:r.name.trim(),number:r.number??"",position:r.position||"",birthYear:r.birthYear||null};
      if(ex){Object.assign(ex,{name:data.name,position:data.position||ex.position,birthYear:data.birthYear||ex.birthYear});updated++}
      else{S.players.push({id:uid(),createdAt:Date.now(),teamId:t.id,foot:"",...data});added++}
    });
    save();imp=null;closeModal();refresh();toast(`Added ${added} players${updated?`, updated ${updated}`:""}`);
  };
}

/* ---------- view: highlights index ---------- */
const Highlights={
  mount(root){crumbs([["Highlights",null]]);root.innerHTML=`<div><div class="eyebrow">Players with tagged clips</div><h1>Highlights</h1></div><div class="panel" id="hl"></div>`},
  update(){
    const cc={};S.clips.forEach(c=>{const x=cc[c.playerId]||(cc[c.playerId]={n:0,d:0,top:0});x.n++;x.d+=c.end-c.start;if(c.rating===3)x.top++});
    const ps=Object.keys(cc).map(id=>byId("players",id)).filter(Boolean).sort((a,b)=>cc[b.id].n-cc[a.id].n);
    $("#hl").innerHTML=ps.length?`<div class="scroll-x"><table><thead><tr><th></th><th>Player</th><th>Team</th><th>Position</th><th>Born</th><th>Clips</th><th>★★★</th><th>Length</th></tr></thead><tbody>
      ${ps.map(p=>{const t=byId("teams",p.teamId);return `<tr><td>${kit(t,p.number)}</td><td><a href="#/player/${esc(p.id)}">${esc(p.name)}</a></td><td><span class="row">${flag(t?.country,"sm")}${esc(t?.name||"")}</span></td><td>${esc(POSL[p.position]||"")}</td><td class="num">${esc(p.birthYear||"")}</td><td class="num">${cc[p.id].n}</td><td class="num">${cc[p.id].top}</td><td class="num">${fmt(cc[p.id].d)}</td></tr>`}).join("")}
    </tbody></table></div>`:`<p class="muted">No tagged clips yet. Open a match and tag players' actions.</p>`;
  }
};
const VIEWS={home:Home,country:Country,team:Team,match:Match,player:Player,highlights:Highlights};

/* ---------- search ---------- */
const q=$("#q"),qr=$("#q-results");
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();if(!s){qr.hidden=true;return}
  const ps=S.players.filter(p=>p.name.toLowerCase().includes(s)||String(p.number)===s).slice(0,8);
  const ts=S.teams.filter(t=>t.name.toLowerCase().includes(s)||(CN[t.country]||"").includes(s)).slice(0,6);
  qr.innerHTML=(ps.length?`<div class="h">Players</div>`+ps.map(p=>{const t=byId("teams",p.teamId);return `<a href="#/player/${esc(p.id)}">${kit(t,p.number)}<span><b>${esc(p.name)}</b><br><span class="muted">${esc(t?.name||"")}</span></span></a>`}).join(""):"")
    +(ts.length?`<div class="h">Teams</div>`+ts.map(t=>`<a href="#/team/${esc(t.id)}">${crest(t,"sm")}<span><b>${esc(t.name)}</b><br><span class="muted">${esc(CN[t.country]||"")}</span></span></a>`).join(""):"")
    ||`<div class="h">No results</div>`;
  qr.hidden=false;
});
qr.addEventListener("click",e=>{if(e.target.closest("a")){qr.hidden=true;q.value=""}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))qr.hidden=true});

/* ---------- modal & settings ---------- */
function openModal(html,locked){
  $("#modal-root").innerHTML=`<div class="modal"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
  $$("[data-close]",$("#modal-root")).forEach(b=>b.onclick=closeModal);
  if(!locked)$(".modal").onclick=e=>{if(e.target.classList.contains("modal"))closeModal()};
}
function closeModal(){if(exporting)return;$("#modal-root").innerHTML=""}
$("#nav-settings").onclick=()=>{
  openModal(`<div class="spread"><h2>Settings</h2><button class="btn ghost" data-close>Close</button></div>
    <h3>Your signature on reels</h3>
    <p class="muted" style="margin:0">Shown in the corner of every highlight reel and on the closing card, so a club receiving the video knows who sent it.</p>
    <label class="f">Name / brand<input id="s-brand" value="${esc(S.settings.brand)}" placeholder="e.g. Ron David · FIFA Licensed Football Agent"></label>
    <label class="f">Contact details<input id="s-contact" value="${esc(S.settings.contact)}" placeholder="Phone / WhatsApp / email"></label>
    <div class="row"><button class="btn primary" id="s-save">Save</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h3>Backup & moving between devices</h3>
    <p class="muted" style="margin:0">All data (teams, players, matches and clips) is stored in this browser. Video files themselves aren't included in the backup.</p>
    <div class="row"><button class="btn" id="s-export">Export backup</button><label class="btn" for="s-import">Restore backup</label><input type="file" id="s-import" accept="application/json,.json" hidden>${hasUndo()?`<button class="btn ghost" id="s-undo">Undo last restore</button>`:""}</div>
    <p class="muted" style="margin:0;font-size:.85rem">Restoring adds the backup to what is already here. Nothing is deleted.</p>`);
  const su=$("#s-undo");if(su)su.onclick=e=>armDelete(e.currentTarget,undoRestore);
  $("#s-save").onclick=()=>{S.settings={brand:$("#s-brand").value.trim(),contact:$("#s-contact").value.trim()};save();closeModal();refresh();toast("Settings saved")};
  $("#s-export").onclick=exportBackup;
  $("#s-import").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};
};
window.addEventListener("beforeunload",e=>{if(exporting){e.preventDefault();e.returnValue=""}});

load();englishize();
refresh(true);
